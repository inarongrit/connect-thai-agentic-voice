<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to Try — FSI Voice AI Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Prompt', sans-serif; background: #0d1421; color: #f4efe6;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,169,97,.16), transparent);
  }
  .eyebrow { font-weight: 300; letter-spacing: .35em; text-transform: uppercase; font-size: .85rem; color: #c9a961; margin-bottom: 20px; }
  h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.3; margin-bottom: 10px; }
  h1 em { font-style: normal; color: #e8c87e; }
  p { font-weight: 300; color: #8a93a3; font-size: 1.2rem; margin-bottom: 44px; }
  .qr {
    background: #f4efe6; padding: 24px; border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(201,169,97,.4), 0 24px 64px rgba(0,0,0,.5);
  }
  .qr img { display: block; width: 300px; height: 300px; }
  .url { margin-top: 28px; color: #c9a961; font-weight: 300; font-size: 1rem; letter-spacing: .05em; }
</style>
</head>
<body>
  <div class="eyebrow">Amazon Connect · Agentic Voice AI</div>
  <h1>ให้ <em>AI</em> โทรหาคุณ<br>สแกนเลย</h1>
  <p>Bank Collection · Insurance · Brokerage — พูดไทยได้จริง</p>
  <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2F__DEMO_DOMAIN__" alt="QR code to demo">
  </div>
  <div class="url">__DEMO_DOMAIN__</div>
</body>
</html>
