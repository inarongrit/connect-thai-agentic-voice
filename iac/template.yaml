AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FSI Outbound Demo - Thai agentic voice outbound calls via Amazon Connect.
  QR/web page starts WebRTC or outbound AI calls in 3 scenarios: bank loan collection,
  insurance recommendation, brokerage market update.
  Prerequisites: an existing Amazon Connect instance with agentic voice available,
  and a claimed outbound-capable phone number. After deploy, run post-deploy.sh.

Parameters:
  ConnectInstanceArn:
    Type: String
    Description: ARN of the existing Amazon Connect instance
    AllowedPattern: ^arn:aws:connect:[a-z0-9-]+:\d{12}:instance/[a-f0-9-]+$
  ConnectInstanceId:
    Type: String
    Description: Instance ID (the UUID part of the instance ARN)
  SourcePhoneNumber:
    Type: String
    Description: Outbound caller ID - a phone number already claimed on the instance (E.164, e.g. +15551230000)
    AllowedPattern: ^\+\d{7,15}$
  ApiOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret injected by CloudFront and validated by the call Lambda
  MantleContactFlowId:
    Type: String
    Default: ''
    Description: Optional contact flow ID for the isolated Luna/Terra dialogue path
  MantleEnabled:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: Explicit feature flag; managed Q remains the default
  GithubFeedbackRepo:
    Type: String
    Default: ''
    Description: Optional owner/repo that mirrors tester feedback as issues
  GithubTokenSecret:
    Type: String
    Default: ''
    Description: Secrets Manager id holding the GitHub token; never a literal token
  GithubFeedbackEnabled:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: Mirror feedback into the issue tracker

Resources:

  # ── Q in Connect (Wisdom) ────────────────────────────────────────────
  Assistant:
    Type: AWS::Wisdom::Assistant
    Properties:
      Name: fsi-demo-assistant
      Type: AGENT
      Description: Q in Connect assistant for FSI outbound demo (Thai)

  KnowledgeBase:
    Type: AWS::Wisdom::KnowledgeBase
    Properties:
      Name: fsi-demo-kb
      KnowledgeBaseType: CUSTOM

  AssistantKbAssociation:
    Type: AWS::Wisdom::AssistantAssociation
    Properties:
      AssistantId: !GetAtt Assistant.AssistantId
      AssociationType: KNOWLEDGE_BASE
      Association:
        KnowledgeBaseId: !GetAtt KnowledgeBase.KnowledgeBaseId

  # Q in Connect <-> Connect instance link
  WisdomIntegration:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: WISDOM_ASSISTANT
      IntegrationArn: !GetAtt Assistant.AssistantArn

  # ── IAM ──────────────────────────────────────────────────────────────
  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fsi-demo-lex-bot-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lexv2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LexQInConnectAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ 'polly:SynthesizeSpeech' ]
                Resource: '*'
              - Effect: Allow
                Action:
                  - wisdom:CreateSession
                  - wisdom:GetSession
                  - wisdom:UpdateSession
                  - wisdom:GetAssistant
                  - wisdom:GetAIAgent
                  - wisdom:GetAIPrompt
                  - wisdom:QueryAssistant
                  - wisdom:GetRecommendations
                  - wisdom:NotifyRecommendationsReceived
                  - wisdom:SendMessage
                  - wisdom:GetNextMessage
                  - wisdom:ListMessages
                  - wisdom:GetContent
                  - wisdom:SearchContent
                  - wisdom:UpdateSessionData
                Resource: '*'

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fsi-demo-lambda-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FeedbackStore
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ dynamodb:PutItem, dynamodb:UpdateItem ]
                Resource: !GetAtt FeedbackTable.Arn
              - Effect: Allow
                Action: [ connect:GetContactAttributes ]
                Resource: !Sub '${ConnectInstanceArn}/contact/*'
        - PolicyName: StartOutboundCall
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ 'connect:StartOutboundVoiceContact', 'connect:StartWebRTCContact', 'connect:DescribeContact' ]
                Resource: !Sub '${ConnectInstanceArn}/*'
              - Effect: Allow
                Action:
                  - wisdom:UpdateSession
                  - wisdom:UpdateSessionData
                  - wisdom:GetSession
                Resource: '*'
              - Effect: Allow
                Action: [ 'connect:UpdateContactAttributes' ]
                Resource: !Sub '${ConnectInstanceArn}/contact/*'
              - Effect: Allow
                Action: [ 'logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents' ]
                Resource: '*'

  # ── Lex bot ──────────────────────────────────────────────────────────
  # NOTE: Advanced ASR (speech model preference) and the Q in Connect AI
  # prompt/agent wiring are applied by post-deploy.sh (API-only features).
  LexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: fsi-demo-bot
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy: { ChildDirected: false }
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: th_TH
          NluConfidenceThreshold: 0.4
          Intents:
            - Name: FSIQInConnect
              ParentIntentSignature: AMAZON.QInConnectIntent
              QInConnectIntentConfiguration:
                QInConnectAssistantConfiguration:
                  AssistantArn: !GetAtt Assistant.AssistantArn
              FulfillmentCodeHook:
                Enabled: false
                IsActive: true
                PostFulfillmentStatusSpecification:
                  SuccessResponse:
                    AllowInterrupt: true
                    MessageGroupsList:
                      - Message:
                          PlainTextMessage:
                            Value: '((x-amz-lex:q-in-connect-response))'
                  SuccessNextStep: { DialogAction: { Type: ElicitIntent } }
                  FailureNextStep: { DialogAction: { Type: ElicitIntent } }
                  TimeoutNextStep: { DialogAction: { Type: ElicitIntent } }
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent

  LexBotVersion:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref LexBot
      BotVersionLocaleSpecification:
        - LocaleId: th_TH
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }

  LexBotAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotAliasName: live
      BotId: !Ref LexBot
      BotVersion: !GetAtt LexBotVersion.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: th_TH
          BotAliasLocaleSetting: { Enabled: true }

  LexIntegration:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LEX_BOT
      IntegrationArn: !GetAtt LexBotAlias.Arn

  # ── Contact flow ─────────────────────────────────────────────────────
  ContactFlow:
    Type: AWS::Connect::ContactFlow
    Properties:
      Name: FSI Outbound Demo Flow
      Description: Outbound demo - bank collection, insurance reco, brokerage marketing (Thai agentic voice)
      InstanceArn: !Ref ConnectInstanceArn
      Type: CONTACT_FLOW
      DependsOn: SessionContextAssociation
      Content: !Sub |
        {"Version":"2019-10-30","StartAction":"logging-1","Metadata":{"entryPointPosition":{"x":15,"y":15},"snapToGrid":false,"name":"FSI Outbound Demo Flow","description":"Scenario agents with deterministic outcome routing","type":"contactFlow","status":"published","ActionMetadata":{"logging-1":{"position":{"x":100,"y":60}},"set-voice-1":{"position":{"x":280,"y":60}},"set-lang-1":{"position":{"x":460,"y":60}},"wisdom-1":{"position":{"x":640,"y":60}},"ctx-1":{"position":{"x":820,"y":60}},"branch-1":{"position":{"x":1000,"y":60}},"input-bank":{"position":{"x":1360,"y":60}},"route-bank":{"position":{"x":100,"y":210}},"outcome-bank":{"position":{"x":280,"y":210}},"input-insurance":{"position":{"x":1360,"y":210}},"route-insurance":{"position":{"x":640,"y":210}},"outcome-insurance":{"position":{"x":820,"y":210}},"input-broker":{"position":{"x":1360,"y":360}},"route-broker":{"position":{"x":1180,"y":210}},"outcome-broker":{"position":{"x":100,"y":360}},"disconnect-1":{"position":{"x":280,"y":360}},"intro-bank":{"position":{"x":1180,"y":60}},"intro-insurance":{"position":{"x":1180,"y":210}},"intro-broker":{"position":{"x":1180,"y":360}},"contact-lens-analytics":{"position":{"x":120,"y":230}}}},"Actions":[{"Identifier":"logging-1","Type":"UpdateFlowLoggingBehavior","Parameters":{"FlowLoggingBehavior":"Enabled"},"Transitions":{"NextAction":"contact-lens-analytics","Errors":[],"Conditions":[]}},{"Identifier":"contact-lens-analytics","Type":"UpdateContactRecordingBehavior","Parameters":{"RecordingBehavior":{"RecordedParticipants":["Agent","Customer"],"IVRRecordingBehavior":"Enabled"},"AnalyticsBehavior":{"Enabled":"True","AnalyticsLanguage":"th-TH","ChannelConfiguration":{"Voice":{"AnalyticsModes":["PostContact","AutomatedInteraction"]}}}},"Transitions":{"NextAction":"set-voice-1","Errors":[],"Conditions":[]}},{"Identifier":"set-voice-1","Type":"UpdateContactTextToSpeechVoice","Parameters":{"TextToSpeechVoice":"SUDA","TextToSpeechEngine":"connect:agentic"},"Transitions":{"NextAction":"set-lang-1","Errors":[{"NextAction":"set-lang-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"set-lang-1","Type":"UpdateContactData","Parameters":{"LanguageCode":"th-TH"},"Transitions":{"NextAction":"wisdom-1","Errors":[{"NextAction":"wisdom-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"wisdom-1","Type":"CreateWisdomSession","Parameters":{"WisdomAssistantArn":"${Assistant.AssistantArn}"},"Transitions":{"NextAction":"ctx-1","Errors":[{"NextAction":"ctx-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"ctx-1","Type":"InvokeLambdaFunction","Parameters":{"LambdaFunctionARN":"${SessionContextFunction.Arn}","InvocationTimeLimitSeconds":"8","LambdaInvocationAttributes":{"sessionArn":"$.Wisdom.SessionArn","scenario":"$.Attributes.scenario","customerName":"$.Attributes.customerName","amount":"$.Attributes.amount","dueDate":"$.Attributes.dueDate"}},"Transitions":{"NextAction":"branch-1","Errors":[{"NextAction":"branch-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"branch-1","Type":"Compare","Parameters":{"ComparisonValue":"$.Attributes.scenario"},"Transitions":{"NextAction":"intro-bank","Errors":[{"NextAction":"intro-bank","ErrorType":"NoMatchingCondition"}],"Conditions":[{"NextAction":"intro-bank","Condition":{"Operator":"Equals","Operands":["bank"]}},{"NextAction":"intro-insurance","Condition":{"Operator":"Equals","Operands":["insurance"]}},{"NextAction":"intro-broker","Condition":{"Operator":"Equals","Operands":["broker"]}}]}},{"Identifier":"input-bank","Type":"ConnectParticipantWithLexBot","Parameters":{"Text":"ไม่ทราบว่ากำลังเรียนสายคุณ $.Attributes.customerName อยู่หรือเปล่าคะ","LexV2Bot":{"AliasArn":"${LexBotAlias.Arn}"},"LexSessionAttributes":{"x-amz-lex:q-in-connect:session-arn":"$.Wisdom.SessionArn","x-amz-lex:audio:end-confidence-threshold:*:*":"0.7","x-amz-lex:audio:end-timeout-ms:*:*":"1100","x-amz-lex:audio:start-timeout-ms:*:*":"6000"}},"Transitions":{"NextAction":"route-bank","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"},{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"},{"NextAction":"disconnect-1","ErrorType":"InputTimeLimitExceeded"}],"Conditions":[]}},{"Identifier":"route-bank","Type":"Compare","Parameters":{"ComparisonValue":"$.Lex.SessionAttributes.Tool"},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"}],"Conditions":[{"NextAction":"outcome-bank","Condition":{"Operator":"Equals","Operands":["BANK_OUTCOME"]}}]}},{"Identifier":"outcome-bank","Type":"InvokeLambdaFunction","Parameters":{"LambdaFunctionARN":"${SessionContextFunction.Arn}","InvocationTimeLimitSeconds":"8","LambdaInvocationAttributes":{"mode":"outcome","sessionArn":"$.Wisdom.SessionArn","scenario":"bank","outcomeType":"$.Lex.SessionAttributes.outcomeType","outcomeDetail":"$.Lex.SessionAttributes.outcomeDetail","paymentType":"$.Lex.SessionAttributes.paymentType","paymentDate":"$.Lex.SessionAttributes.paymentDate","paymentAmount":"$.Lex.SessionAttributes.paymentAmount"}},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"input-insurance","Type":"ConnectParticipantWithLexBot","Parameters":{"Text":"คุณ $.Attributes.customerName สะดวกคุยสักครู่ไหมคะ","LexV2Bot":{"AliasArn":"${LexBotAlias.Arn}"},"LexSessionAttributes":{"x-amz-lex:q-in-connect:session-arn":"$.Wisdom.SessionArn","x-amz-lex:audio:end-confidence-threshold:*:*":"0.7","x-amz-lex:audio:end-timeout-ms:*:*":"1100","x-amz-lex:audio:start-timeout-ms:*:*":"6000"}},"Transitions":{"NextAction":"route-insurance","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"},{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"},{"NextAction":"disconnect-1","ErrorType":"InputTimeLimitExceeded"}],"Conditions":[]}},{"Identifier":"route-insurance","Type":"Compare","Parameters":{"ComparisonValue":"$.Lex.SessionAttributes.Tool"},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"}],"Conditions":[{"NextAction":"outcome-insurance","Condition":{"Operator":"Equals","Operands":["INSURANCE_OUTCOME"]}}]}},{"Identifier":"outcome-insurance","Type":"InvokeLambdaFunction","Parameters":{"LambdaFunctionARN":"${SessionContextFunction.Arn}","InvocationTimeLimitSeconds":"8","LambdaInvocationAttributes":{"mode":"outcome","sessionArn":"$.Wisdom.SessionArn","scenario":"insurance","outcomeType":"$.Lex.SessionAttributes.outcomeType","outcomeDetail":"$.Lex.SessionAttributes.outcomeDetail","productInterest":"$.Lex.SessionAttributes.productInterest","preferredTime":"$.Lex.SessionAttributes.preferredTime"}},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"input-broker","Type":"ConnectParticipantWithLexBot","Parameters":{"Text":"คุณ $.Attributes.customerName สนใจรับรายละเอียดไหมคะ","LexV2Bot":{"AliasArn":"${LexBotAlias.Arn}"},"LexSessionAttributes":{"x-amz-lex:q-in-connect:session-arn":"$.Wisdom.SessionArn","x-amz-lex:audio:end-confidence-threshold:*:*":"0.7","x-amz-lex:audio:end-timeout-ms:*:*":"1100","x-amz-lex:audio:start-timeout-ms:*:*":"6000"}},"Transitions":{"NextAction":"route-broker","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"},{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"},{"NextAction":"disconnect-1","ErrorType":"InputTimeLimitExceeded"}],"Conditions":[]}},{"Identifier":"route-broker","Type":"Compare","Parameters":{"ComparisonValue":"$.Lex.SessionAttributes.Tool"},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingCondition"}],"Conditions":[{"NextAction":"outcome-broker","Condition":{"Operator":"Equals","Operands":["BROKERAGE_OUTCOME"]}}]}},{"Identifier":"outcome-broker","Type":"InvokeLambdaFunction","Parameters":{"LambdaFunctionARN":"${SessionContextFunction.Arn}","InvocationTimeLimitSeconds":"8","LambdaInvocationAttributes":{"mode":"outcome","sessionArn":"$.Wisdom.SessionArn","scenario":"broker","outcomeType":"$.Lex.SessionAttributes.outcomeType","outcomeDetail":"$.Lex.SessionAttributes.outcomeDetail","preferredTime":"$.Lex.SessionAttributes.preferredTime","topicInterest":"$.Lex.SessionAttributes.topicInterest"}},"Transitions":{"NextAction":"disconnect-1","Errors":[{"NextAction":"disconnect-1","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"disconnect-1","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}},{"Identifier":"intro-bank","Type":"MessageParticipant","Parameters":{"Text":"สวัสดีค่ะ ดิฉันโทรมาจากฝ่ายบริการลูกค้าของธนาคารนะคะ"},"Transitions":{"NextAction":"input-bank","Errors":[{"NextAction":"input-bank","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"intro-insurance","Type":"MessageParticipant","Parameters":{"Text":"สวัสดีค่ะ ดิฉันสุดา ผู้ช่วยอัตโนมัติของบริษัทประกันค่ะ โทรมาเพื่อนำเสนอข้อมูลแผนความคุ้มครอง การสนทนานี้อาจถูกบันทึกเพื่อพัฒนาคุณภาพบริการค่ะ ดิฉันไม่ใช่ตัวแทนที่ได้รับอนุญาต หากสนใจจะให้เจ้าหน้าที่ผู้ได้รับอนุญาตติดต่อกลับค่ะ"},"Transitions":{"NextAction":"input-insurance","Errors":[{"NextAction":"input-insurance","ErrorType":"NoMatchingError"}],"Conditions":[]}},{"Identifier":"intro-broker","Type":"MessageParticipant","Parameters":{"Text":"สวัสดีค่ะ ดิฉันสุดา ผู้ช่วยอัตโนมัติของบริษัทหลักทรัพย์ค่ะ โทรมาแจ้งข้อมูลสัมมนาการลงทุน ไม่ใช่การให้คำแนะนำการลงทุนค่ะ การสนทนานี้อาจถูกบันทึกเพื่อพัฒนาคุณภาพบริการ และผู้แนะนำการลงทุนที่ได้รับอนุญาตจะเป็นผู้ดูแลรายละเอียดค่ะ"},"Transitions":{"NextAction":"input-broker","Errors":[{"NextAction":"input-broker","ErrorType":"NoMatchingError"}],"Conditions":[]}}]}
  # ── Lambda + API ─────────────────────────────────────────────────────
  SessionContextFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: fsi-qic-session-context
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          INSTANCE_ID: !Ref ConnectInstanceId
          SCENARIO_AGENT_IDS: '{}'
      Code:
        ZipFile: |
          """Select scenario agents, initialize session state, and persist terminal outcomes."""
          import json
          import os
          import re
          
          import boto3
          
          qconnect = boto3.client("qconnect")
          connect = boto3.client("connect")
          
          INSTANCE_ID = os.environ.get("INSTANCE_ID", "")
          AGENT_IDS = json.loads(os.environ.get("SCENARIO_AGENT_IDS", "{}"))
          
          _THAI_DIGITS = ("ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า")
          
          
          def _thai_integer_words(value):
              """Render a non-negative integer as continuous Thai number words."""
              value = int(value)
              if value == 0:
                  return _THAI_DIGITS[0]
              if value >= 1_000_000:
                  millions, remainder = divmod(value, 1_000_000)
                  return _thai_integer_words(millions) + "ล้าน" + (
                      _thai_integer_words(remainder) if remainder else ""
                  )
              words = []
              for divisor, label in ((100_000, "แสน"), (10_000, "หมื่น"), (1_000, "พัน"), (100, "ร้อย")):
                  digit, value = divmod(value, divisor)
                  if digit:
                      words.append(_THAI_DIGITS[digit] + label)
              tens, units = divmod(value, 10)
              if tens == 1:
                  words.append("สิบ")
              elif tens == 2:
                  words.append("ยี่สิบ")
              elif tens:
                  words.append(_THAI_DIGITS[tens] + "สิบ")
              if units:
                  words.append("เอ็ด" if units == 1 and words else _THAI_DIGITS[units])
              return "".join(words)
          
          
          def _thai_baht_words(amount):
              """Render a decimal currency attribute without exposing punctuation to TTS."""
              raw = re.sub(r"[\s,]", "", str(amount or ""))
              if not re.fullmatch(r"\d+(?:\.\d{1,2})?", raw):
                  return (str(amount or "ยอดตามที่แจ้ง").strip() + "บาท").replace(" ", "")
              whole_text, dot, fraction = raw.partition(".")
              whole = int(whole_text)
              satang = int((fraction + "00")[:2]) if dot else 0
              spoken = _thai_integer_words(whole) + "บาท"
              return spoken + (_thai_integer_words(satang) + "สตางค์" if satang else "ถ้วน")
          
          
          BRIEFS = {
              "bank": (
                  "ROLE: Collections officer at a bank. CUSTOMER_NAME={name}. "
                  "FACTS: AMOUNT_NUMERIC={amount}; AMOUNT_SPOKEN={amount_spoken}; DUE_DATE={due}. "
                  "DISCLOSURE: after identity confirmation, begin with ขอบคุณที่ยืนยันตัวนะคะ คุณ followed by CUSTOMER_NAME; then speak AMOUNT_SPOKEN exactly and never vocalize AMOUNT_NUMERIC. "
                  "OBJECTIVE: obtain a specific payment commitment with a date. "
                  "ALLOWED OPTIONS: full payment, partial payment, or installment plan. "
                  "FORBIDDEN: threats, shame, other products, or invented figures."
              ),
              "insurance": (
                  "ROLE: Outbound representative at an insurance company. CUSTOMER: {name}. "
                  "OBJECTIVE: discover one broad coverage need and one customer priority, share no more than one "
                  "approved category fact, recap the customer's own words, then ask permission for a licensed-agent handoff. "
                  "GROUNDING: use only approved facts in the AI prompt and customer-provided facts. "
                  "ENGAGEMENT: warm and curious through relevance and accurate recap, never hype. "
                  "CONDUCT: helpful and concise, one invitation only, accept no immediately, no hard sell, urgency, scarcity, or FOMO. "
                  "FORBIDDEN: invented products or benefits, premiums, acceptance promises, closing a sale, loans, or pressure."
              ),
              "broker": (
                  "ROLE: Client relations officer at a securities brokerage. CUSTOMER: {name}. "
                  "OBJECTIVE: discover the customer's learning topic and general experience before offering tailored seminar "
                  "details or a licensed consultation; generic interest never closes the call. "
                  "GROUNDING: use only approved educational facts in the AI prompt and customer-provided facts; no live market claims. "
                  "ENGAGEMENT: warm and curious through relevance and accurate recap, never hype. "
                  "CONDUCT: helpful and concise, one invitation only, accept no immediately, no hard sell, urgency, scarcity, fear, or FOMO. "
                  "FORBIDDEN: stock recommendations, returns, price targets, suitability decisions, invented information, loans, or insurance."
              ),
          }
          
          INITIAL_STATE = {
              "bank": {
                  "version": 2,
                  "scenario": "bank",
                  "stage": "verify_identity",
                  "objective": "verify identity, collect one payment value per turn, and confirm the complete read-back",
                  "requiredBeforeClose": [
                      "identityConfirmed",
                      "paymentType",
                      "paymentDate",
                      "explicitConfirmation",
                  ],
                  "outcome": "pending",
                  "turnBudget": 9,
                  "noiseRecovery": {
                      "neverGuess": True,
                      "repeatBeforeCallback": 2,
                      "fallback": "offer_callback",
                  },
              },
              "insurance": {
                  "version": 2,
                  "scenario": "insurance",
                  "stage": "qualify_need",
                  "objective": "identify one need and customer priority, obtain handoff permission, then confirm appointment timing",
                  "requiredBeforeClose": [
                      "productInterest",
                      "customerPriority",
                      "preferredTime",
                      "explicitConfirmation",
                  ],
                  "outcome": "pending",
                  "turnBudget": 9,
                  "noiseRecovery": {
                      "neverGuess": True,
                      "repeatBeforeCallback": 2,
                      "fallback": "offer_callback",
                  },
              },
              "broker": {
                  "version": 2,
                  "scenario": "broker",
                  "stage": "discover_interest",
                  "objective": "discover topic and experience, then send tailored seminar details or confirm licensed-consultation timing",
                  "requiredBeforeClose": ["topicInterest", "experienceLevel", "selectedAction"],
                  "confirmationRequiredFor": ["consultation"],
                  "outcome": "pending",
                  "turnBudget": 8,
                  "noiseRecovery": {
                      "neverGuess": True,
                      "repeatBeforeCallback": 2,
                      "fallback": "offer_callback",
                  },
              },
          }
          
          
          def _parse_session_arn(session_arn):
              tail = session_arn.split(":session/", 1)[1]
              assistant_id, session_id = tail.split("/", 1)
              return assistant_id, session_id
          
          
          def _session_ids(parameters):
              return _parse_session_arn(parameters.get("sessionArn", ""))
          
          
          def _clean_attributes(values):
              return {
                  key: str(value)[:32767]
                  for key, value in values.items()
                  if value not in (None, "", "$.Lex.SessionAttributes.undefined")
              }
          
          
          def _record_outcome(event, parameters):
              scenario = (parameters.get("scenario") or "unknown").lower()
              outcome_type = parameters.get("outcomeType") or "unknown"
              details = _clean_attributes(
                  {
                      "fsiScenario": scenario,
                      "fsiOutcome": outcome_type,
                      "fsiOutcomeDetail": parameters.get("outcomeDetail"),
                      "fsiPaymentType": parameters.get("paymentType"),
                      "fsiPaymentDate": parameters.get("paymentDate"),
                      "fsiPaymentAmount": parameters.get("paymentAmount"),
                      "fsiProductInterest": parameters.get("productInterest"),
                      "fsiPreferredTime": parameters.get("preferredTime"),
                      "fsiTopicInterest": parameters.get("topicInterest"),
                  }
              )
          
              session_arn = parameters.get("sessionArn", "")
              if ":session/" in session_arn:
                  assistant_id, session_id = _parse_session_arn(session_arn)
                  terminal_state = {
                      "version": 1,
                      "scenario": scenario,
                      "stage": "closed",
                      "outcome": outcome_type,
                      "details": details,
                  }
                  qconnect.update_session_data(
                      assistantId=assistant_id,
                      sessionId=session_id,
                      data=[
                          {
                              "key": "callState",
                              "value": {
                                  "stringValue": json.dumps(
                                      terminal_state, ensure_ascii=False, separators=(",", ":")
                                  )
                              },
                          }
                      ],
                  )
          
              contact_data = event.get("Details", {}).get("ContactData", {}) or {}
              contact_id = contact_data.get("InitialContactId") or contact_data.get("ContactId")
              if INSTANCE_ID and contact_id and details:
                  connect.update_contact_attributes(
                      InstanceId=INSTANCE_ID,
                      InitialContactId=contact_id,
                      Attributes=details,
                  )
              return {"status": "ok", "mode": "outcome", "outcome": outcome_type}
          
          
          def _setup_session(parameters):
              session_arn = parameters.get("sessionArn", "")
              scenario = (parameters.get("scenario") or "bank").lower()
              if scenario not in BRIEFS:
                  scenario = "bank"
          
              name = parameters.get("customerName") or "ลูกค้า"
              amount = parameters.get("amount") or "-"
              amount_spoken = _thai_baht_words(amount)
              due_date = parameters.get("dueDate") or "-"
              assistant_id, session_id = _parse_session_arn(session_arn)
          
              agent_id = AGENT_IDS.get(scenario)
              if not agent_id:
                  raise ValueError(f"missing agent ID for scenario: {scenario}")
          
              brief = BRIEFS[scenario].format(name=name, amount=amount, amount_spoken=amount_spoken, due=due_date)
              call_state = dict(INITIAL_STATE[scenario])
              call_state["customerName"] = name
          
              qconnect.update_session(
                  assistantId=assistant_id,
                  sessionId=session_id,
                  aiAgentConfiguration={"SELF_SERVICE": {"aiAgentId": agent_id}},
              )
              qconnect.update_session_data(
                  assistantId=assistant_id,
                  sessionId=session_id,
                  data=[
                      {"key": "scenarioBrief", "value": {"stringValue": brief}},
                      {"key": "customerName", "value": {"stringValue": name}},
                      {
                          "key": "callState",
                          "value": {
                              "stringValue": json.dumps(
                                  call_state, ensure_ascii=False, separators=(",", ":")
                              )
                          },
                      },
                  ],
              )
              return {
                  "status": "ok",
                  "mode": "setup",
                  "scenario": scenario,
                  "agentId": agent_id,
                  "stage": call_state["stage"],
              }
          
          
          def handler(event, context):
              parameters = event.get("Details", {}).get("Parameters", {}) or {}
              try:
                  if parameters.get("mode") == "outcome":
                      return _record_outcome(event, parameters)
                  return _setup_session(parameters)
              except (IndexError, ValueError) as error:
                  print(f"invalid session setup: {error}")
                  return {"status": "skipped", "reason": "invalid session setup"}
              except Exception as error:  # never break the call over context persistence
                  print(f"session operation failed: {error}")
                  return {"status": "error", "reason": "session operation failed"}

  SessionContextPermission:
