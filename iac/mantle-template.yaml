AWSTemplateFormatVersion: '2010-09-09'
Description: Feature-flagged Thai GPT-5.6 Luna/Terra dialogue experiment for Amazon Connect

Parameters:
  AssistanceProgram:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      When true, a bank caller who cannot pay is offered named relief options by the
      agent instead of being transferred straight to a person.
  ConnectInstanceArn:
    Type: String
    AllowedPattern: ^arn:aws:connect:[a-z0-9-]+:\d{12}:instance/[a-f0-9-]+$
  ConnectInstanceId:
    Type: String
  SessionContextFunctionArn:
    Type: String
    AllowedPattern: ^arn:aws:lambda:[a-z0-9-]+:\d{12}:function:[A-Za-z0-9-_]+$
  CustomerProfilesDomain:
    Type: String
    Description: >-
      Customer Profiles domain used to recognise inbound callers by the number they
      dial from. Created with the Connect instance and not managed by this stack.
    Default: ''
  QConnectAssistantId:
    Type: String
    Description: >-
      Amazon Q in Connect assistant used to answer inbound questions from the Thai
      knowledge base. Supplied at deploy time; the assistant itself was created
      outside CloudFormation and is not managed by this stack.
    AllowedPattern: ^[a-f0-9-]{36}$
  HoldPromptArn:
    Type: String
    Description: >-
      Audio played while an escalated caller waits. Instance-specific, so it is
      supplied at deploy time rather than committed.
    AllowedPattern: ^arn:aws:connect:[a-z0-9-]+:\d{12}:instance/[a-f0-9-]+/prompt/[a-f0-9-]+$
  HandoffQueueArn:
    Type: String
    Description: >-
      Queue that receives calls the assistant escalates to a person. Supplied at
      deploy time rather than hardcoded so the stack can be redeployed into any
      instance, and so no account-specific identifier lives in the repository.
    AllowedPattern: ^arn:aws:connect:[a-z0-9-]+:\d{12}:instance/[a-f0-9-]+/queue/[a-f0-9-]+$

Resources:
  MantleDialogueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fsi-mantle-dialogue-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: QConnectKnowledgeBaseRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - wisdom:QueryAssistant
                  - wisdom:CreateSession
                  - wisdom:GetSession
                Resource:
                  # CreateSession authorises against the assistant ARN with a
                  # trailing wildcard -- sessions are children of the assistant, not a
                  # separate top-level resource. Guessing session/<id>/* produced an
                  # AccessDenied that the code reported as an empty knowledge base.
                  - !Sub arn:${AWS::Partition}:wisdom:${AWS::Region}:${AWS::AccountId}:assistant/${QConnectAssistantId}
                  - !Sub arn:${AWS::Partition}:wisdom:${AWS::Region}:${AWS::AccountId}:assistant/${QConnectAssistantId}/*
        - PolicyName: CustomerProfilesRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: profile:SearchProfiles
                Resource: !Sub arn:${AWS::Partition}:profile:${AWS::Region}:${AWS::AccountId}:domains/${CustomerProfilesDomain}
        - PolicyName: BedrockLunaTerraAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.openai.gpt-5.6-luna
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.openai.gpt-5.6-terra
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:project/default
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/openai.gpt-5.6-luna
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/openai.gpt-5.6-terra
              - Effect: Allow
                Action: [ logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents ]
                Resource: '*'

  MantleDialogueFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: fsi-mantle-dialogue
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MantleDialogueRole.Arn
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          LUNA_MODEL_ID: us.openai.gpt-5.6-luna
          TERRA_MODEL_ID: us.openai.gpt-5.6-terra
          MAX_TURNS: '10'
          QCONNECT_ASSISTANT_ID: !Ref QConnectAssistantId
          # Measured boundary: on-topic questions scored 0.518 upward, off-topic ones
          # 0.446 downward, so this sits between them. See the note in the Lambda.
          KB_SCORE_FLOOR: '0.48'
          ASSISTANCE_PROGRAM: !Ref AssistanceProgram
          PROFILE_DOMAIN: !Ref CustomerProfilesDomain
      Code:
        ZipFile: |
          """Feature-flagged Thai dialogue engine using GPT-5.6 on Amazon Bedrock."""
          import hmac
          import json
          import uuid
          import os
          import re
          import time

          import boto3

          bedrock = boto3.client("bedrock-runtime", region_name=os.environ.get("AWS_REGION", "us-west-2"))

          LUNA_MODEL_ID = os.environ.get("LUNA_MODEL_ID", "us.openai.gpt-5.6-luna")
          TERRA_MODEL_ID = os.environ.get("TERRA_MODEL_ID", "us.openai.gpt-5.6-terra")
          MAX_TURNS = int(os.environ.get("MAX_TURNS", "10"))
          POLICY_V2 = os.environ.get("NEGOTIATION_POLICY_V2", "true").lower() == "true"
          MAX_REPEATS = int(os.environ.get("MAX_REPEATS", "1"))
          # Collections feedback: a caller who genuinely cannot pay was transferred straight to a
          # person, so the agent kept the easy calls and handed over every hard one. With this on,
          # it presents the named assistance options itself and only transfers when a person is
          # actually needed. Default off so it can be enabled deliberately.
          ASSISTANCE_PROGRAM = os.environ.get("ASSISTANCE_PROGRAM", "false").lower() == "true"

          _THAI_DIGITS = ("ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า")


          def _thai_integer_words(value):
              """Render a non-negative integer as continuous Thai number words."""
              value = int(value)
              if value == 0:
                  return _THAI_DIGITS[0]
              if value >= 1_000_000:
                  millions, remainder = divmod(value, 1_000_000)
                  return _thai_integer_words(millions) + "ล้าน" + (
                      _thai_integer_words(remainder) if remainder else ""
                  )
              words = []
              for divisor, label in ((100_000, "แสน"), (10_000, "หมื่น"), (1_000, "พัน"), (100, "ร้อย")):
                  digit, value = divmod(value, divisor)
                  if digit:
                      words.append(_THAI_DIGITS[digit] + label)
              tens, units = divmod(value, 10)
              if tens == 1:
                  words.append("สิบ")
              elif tens == 2:
                  words.append("ยี่สิบ")
              elif tens:
                  words.append(_THAI_DIGITS[tens] + "สิบ")
              if units:
                  words.append("เอ็ด" if units == 1 and words else _THAI_DIGITS[units])
              return "".join(words)


          def _thai_baht_words(amount):
              """Render a decimal currency attribute without exposing punctuation to TTS."""
              raw = re.sub(r"[\s,]", "", str(amount or ""))
              if not re.fullmatch(r"\d+(?:\.\d{1,2})?", raw):
                  return (str(amount or "ยอดตามที่แจ้ง").strip() + "บาท").replace(" ", "")
              whole_text, dot, fraction = raw.partition(".")
              whole = int(whole_text)
              satang = int((fraction + "00")[:2]) if dot else 0
              spoken = _thai_integer_words(whole) + "บาท"
              return spoken + (_thai_integer_words(satang) + "สตางค์" if satang else "ถ้วน")


          SCENARIOS = {"bank", "insurance", "broker"}
          YES_WORDS = re.compile(r"ใช่|ถูกต้อง|ยืนยัน|ตกลง|โอเค|ได้เลย|ได้ครับ|ได้ค่ะ|ได้คะ|ครับผม")
          NO_WORDS = re.compile(r"ไม่ใช่|ไม่ถูก|ไม่ต้อง|ไม่สะดวก|ไม่ได้|ผิด|ขอแก้|เปลี่ยน")
          DATE_WORDS = re.compile(
              r"วัน|วันที่|พรุ่งนี้|มะรืน|จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|เสาร์|อาทิตย์|"
              r"เช้า|สาย|เที่ยง|บ่าย|เย็น|ค่ำ|ทุ่ม|โมง|นาฬิกา|มกราคม|กุมภาพันธ์|มีนาคม|"
              r"เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม|"
              r"เดือน|สัปดาห์|ต้นเดือน|กลางเดือน|ปลายเดือน|สิ้นเดือน|อีก|"
              r"มกรา|กุมภา|มีนา|เมษา|พฤษภา|มิถุนา|กรกฎา|สิงหา|กันยา|ตุลา|พฤศจิกา|ธันวา"
          )
          AMOUNT_WORDS = re.compile(
              r"[0-9๐-๙]|ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|"
              r"ร้อย|พัน|หมื่น|แสน|ล้าน|บาท"
          )

          # Deterministic Thai signal detection. Kept as explicit patterns rather than left
          # to the model so that hardship and vulnerability handling stays auditable.
          DNC_RE = re.compile(
              r"ห้ามโทร|อย่าโทรมา|ไม่ต้องโทรมา|เลิกโทร|อย่าติดต่อ|ยกเลิกการติดต่อ|ขอถอนความยินยอม"
          )
          VULNERABLE_RE = re.compile(
              r"ป่วยหนัก|ป่วยอยู่|นอนโรงพยาบาล|เข้าโรงพยาบาล|เสียชีวิต|พิการ|ทุพพลภาพ|"
              r"ดูแลผู้ป่วย|ผู้สูงอายุ|คนพิการ"
          )
          COMPLAINT_RE = re.compile(
              r"ร้องเรียน|ไม่พอใจ|บริการแย่|แย่มาก|โทรมาบ่อย|รบกวนมาก|จะฟ้อง|เอาเรื่อง|คุยไม่รู้เรื่อง|ฟังไม่รู้เรื่อง"
          )
          HARDSHIP_RE = re.compile(
              r"ไม่มีเงิน|ไม่มีตังค์|ไม่มีตัง|ไม่มีสตางค์|เงินไม่พอ|จ่ายไม่ได้|ชำระไม่ได้|ผ่อนไม่ไหว|"
              r"ไม่ไหว|ขอเลื่อน|เลื่อนไป|ขอผ่อนผัน|ขอพักชำระ|พักหนี้|ขอลดค่างวด|ตกงาน|ถูกเลิกจ้าง|"
              r"รายได้ลด|ลำบาก|เดือดร้อน|ยังไม่มีเงิน|ขอไม่จ่าย|ขาดทุน|ติดดอย"
          )
          # Most protective signal first: a contact ban or a vulnerable customer outranks
          # any collections or sales objective.
          SIGNAL_PATTERNS = (
              ("do_not_contact", DNC_RE),
              ("vulnerability", VULNERABLE_RE),
              ("complaint", COMPLAINT_RE),
              ("hardship", HARDSHIP_RE),
          )
          SHARED_SIGNAL_INTENTS = {"hardship", "vulnerability", "complaint", "do_not_contact"}

          # Outcomes that warrant a live agent. Each one means the conversation has reached
          # something an automated caller must not settle on its own: a request for a human,
          # a vulnerability or complaint disclosure, a regulated recommendation, or a failure
          # to make progress. do_not_contact is deliberately absent -- honouring a contact
          # ban means ending the call, not routing it to a person who would speak anyway.
          HANDOFF_OUTCOMES = frozenset({
              "human_transfer",
              "vulnerability_referral",
              "complaint_logged",
              "unresolved_needs_human",
              "licensed_rep_referral",
              "affordability_review",
              # Added when inbound servicing began routing deferral requests to a person. The
              # outcome already told the caller a person would take over, but it was not in this
              # set, so the flow would have played the transfer wording and then hung up -- the
              # same defect as the first handoff deploy, in a different outcome.
              "payment_assistance_referral",
          })

          # Why the agent is receiving this call, in Thai, for the whisper and the CCP.
          HANDOFF_REASON_TH = {
              "human_transfer": "ลูกค้าขอคุยกับเจ้าหน้าที่",
              "vulnerability_referral": "ลูกค้าเปราะบาง ต้องดูแลเป็นกรณีพิเศษ",
              "complaint_logged": "ลูกค้าแจ้งข้อร้องเรียน",
              "unresolved_needs_human": "ระบบไม่สามารถช่วยได้ ต้องให้เจ้าหน้าที่ดูแล",
              "licensed_rep_referral": "ต้องผู้แนะนำการลงทุนที่ได้รับอนุญาต",
              "affordability_review": "ขอทบทวนความคุ้มครองและค่าเบี้ยที่เหมาะสม",
              "payment_assistance_referral": "ขอผ่อนผันการชำระ",
          }

          SCENARIO_TH = {"bank": "ธนาคาร", "insurance": "ประกัน", "broker": "หลักทรัพย์"}

          # Spoken once, immediately before the transfer is attempted. The flow, not the
          # dialogue, decides whether an agent is actually reachable, so this promises a
          # transfer and never a callback -- the callback wording belongs to the fallback
          # branch that runs only when nobody is staffed.
          HANDOFF_HOLD_TH = "ขอโอนสายให้เจ้าหน้าที่ดูแลต่อนะคะ กรุณาถือสายรอสักครู่ค่ะ"

          # --- Inbound knowledge base answering ---------------------------------------
          # Inbound callers ask questions; the outbound dialogue answers none of them. This
          # mode retrieves from the Thai knowledge base and speaks a grounded answer, falling
          # back to the same human handoff when it cannot answer.
          INBOUND_KB_MODE = "inbound_kb"
          QCONNECT_ASSISTANT_ID = os.environ.get("QCONNECT_ASSISTANT_ID", "")

          # Retrieval returns whole documents, and an off-topic question still matches
          # something, so a floor decides whether we actually know the answer.
          #
          # Measured over nine questions against the real content:
          #   on-topic  0.518 0.519 0.541 0.580 0.613 0.620
          #   off-topic 0.409 0.426 0.446
          # The boundary is therefore between 0.446 and 0.518, and 0.48 sits in it with roughly
          # equal margin either side. An earlier value of 0.55, guessed from two samples, sat
          # above three legitimate questions -- asking what time a branch opens was answered
          # with "I do not know" and a transfer.
          KB_SCORE_FLOOR = float(os.environ.get("KB_SCORE_FLOOR", "0.48"))

          # Thai is written without spaces between words, so word tokenisation would need a
          # dictionary. Character trigrams need none and are enough to pick the right section
          # of a document, which is the only judgement being made here.
          #
          # Deliberately not used to judge relevance. Measured against the real content,
          # on-topic questions scored 0.143 to 1.000 and off-topic ones 0.100 to 0.200, so the
          # two ranges overlap and any threshold would reject real answers. Relevance is the
          # retrieval score's job, where the separation is clean; trigrams only choose which
          # section of an already-relevant document to read out.
          _TRIGRAM_SIZE = 3
          KB_ANSWER_LIMIT = 260

          KB_NO_ANSWER_TH = ("ขออภัยค่ะ ดิฉันยังไม่มีข้อมูลเรื่องนี้ "
                             "ขอโอนสายให้เจ้าหน้าที่ช่วยดูแลนะคะ")
          KB_INVITE_TH = "สอบถามเรื่องอื่นได้อีกนะคะ, หรือหากต้องการคุยกับเจ้าหน้าที่ แจ้งได้เลยค่ะ"

          # --- Caller recognition and account servicing -------------------------------
          # Two things a knowledge base cannot do: know who is calling, and answer about their
          # own account. Both come from Customer Profiles, keyed on the number the call arrived
          # from. When there is no profile the caller is simply treated as unknown, which is the
          # common case for an audience dialling in.
          PROFILE_LOOKUP_MODE = "profile_lookup"
          PROFILE_DOMAIN = os.environ.get("PROFILE_DOMAIN", "")

          # Servicing questions are about the caller's own account, so they are answered from
          # the profile rather than the knowledge base, and only when a profile was found.
          BALANCE_RE = re.compile(r"ยอด|ค้างชำระ|หนี้|ต้องจ่าย|เท่าไหร่ที่ต้อง|ยอดคงเหลือ")
          DUE_DATE_RE = re.compile(r"ครบกำหนด|กำหนดชำระ|วันไหน|เมื่อไหร่|วันครบ")
          DEFER_REQUEST_RE = re.compile(r"เลื่อน|ผ่อนผัน|ขอผ่อน|ยังไม่พร้อม|จ่ายไม่ทัน|ขอเวลา")

          PROFILE_UNKNOWN_TH = "ขออภัยค่ะ ดิฉันยังไม่พบข้อมูลบัญชีจากเบอร์ที่โทรเข้ามาค่ะ"

          # --- Keypad verification before disclosing an account -----------------------
          # Recognising the number a call came from is not authentication: anyone holding the
          # handset would otherwise hear the balance. Verification is a four digit secret entered
          # on the keypad, which also keeps it out of the transcript and the recording -- Contact
          # Lens cannot redact Thai, so anything spoken aloud is stored in the clear.
          VERIFY_MODE = "verify"
          VERIFY_UNVERIFIED_TH = ("ขออภัยค่ะ ดิฉันยังไม่สามารถแจ้งข้อมูลบัญชีได้ "
                                  "เนื่องจากยังไม่ได้ยืนยันตัวตนค่ะ")


          def _handle_verify(parameters, event):
              """Compare the digits keyed in against the secret held on the profile."""
              entered = re.sub(r"\D", "", str(parameters.get("enteredDigits", "") or ""))
              fields = _profile_fields(_caller_number(event or {}, parameters))
              expected = re.sub(r"\D", "", fields.get("verifyDigits", ""))
              # compare_digest so the comparison does not leak the secret through timing, and an
              # absent secret fails closed rather than matching an empty entry.
              verified = bool(expected) and bool(entered) and hmac.compare_digest(entered, expected)
              print(f"verify: entered={'yes' if entered else 'no'} "
                    f"expected={'set' if expected else 'MISSING'} verified={verified}")
              return {"verified": "true" if verified else "false"}



          def _profile_fields(phone):
              """Look up the caller by the number the call arrived from.

              Returns {} when there is no profile, no domain configured, or the lookup fails.
              An unknown caller is normal, not an error, so this never raises.
              """
              if not (PROFILE_DOMAIN and phone):
                  return {}
              try:
                  client = boto3.client("customer-profiles",
                                        region_name=os.environ.get("AWS_REGION", "us-west-2"))
                  found = client.search_profiles(DomainName=PROFILE_DOMAIN, KeyName="_phone",
                                                 Values=[phone], MaxResults=5).get("Items", [])
              except Exception as exc:
                  print(f"profile lookup failed: {type(exc).__name__}: {exc}")
                  return {}
              if not found:
                  return {}
              # Connect creates a bare profile for every caller it has not seen, so a number can
              # match several: the automatic one with no name, and the enriched record that
              # actually identifies the customer. Taking the first match found the empty one and
              # reported the caller as unknown, so a named profile wins when one exists.
              profile = next((p for p in found if p.get("FirstName")), found[0])
              attributes = profile.get("Attributes") or {}
              return {
                  "firstName": profile.get("FirstName") or "",
                  "lastName": profile.get("LastName") or "",
                  "accountType": attributes.get("accountType", ""),
                  "amount": attributes.get("outstandingAmount", ""),
                  "dueDate": attributes.get("dueDate", ""),
                  "policyNumber": attributes.get("policyNumber", ""),
                  "verifyDigits": attributes.get("verifyDigits", ""),
              }


          def _profile_greeting(fields):
              """Name the caller when recognised, and say nothing when not.

              This deliberately carries no disclosure. An earlier version put the assistant's
              identity and the automated-voice notice here, and when the flow's invocation of
              this Lambda was denied the attribute came back empty -- so a real caller heard a
              greeting with neither disclosure in it. Anything a caller must be told belongs in
              the flow's static text, which cannot fail.
              """
              first = fields.get("firstName")
              return f"สวัสดีคุณ{first}ค่ะ" if first else ""


          def _profile_summary(fields):
              """What the agent should see about a recognised caller."""
              if not fields.get("firstName"):
                  return ""
              parts = [f"ลูกค้า {fields['firstName']} {fields.get('lastName', '')}".strip()]
              for label, key in (("ประเภทบัญชี", "accountType"), ("ยอดค้างชำระ", "amount"),
                                 ("ครบกำหนด", "dueDate"), ("เลขกรมธรรม์", "policyNumber")):
                  if fields.get(key):
                      parts.append(f"{label} {fields[key]}")
              return _compact(" | ".join(parts), 200)


          def _caller_number(event, parameters):
              """The number the call arrived from.

              Taken from ContactData, which Connect populates on every voice contact, rather
              than relying on the flow substituting $.CustomerEndpoint.Address into a parameter.
              The parameter is still honoured first so the behaviour can be driven directly, but
              it is no longer the only source: when it arrived empty the lookup silently found
              nobody and the caller was greeted as a stranger with nothing in the log to say why.
              """
              supplied = str(parameters.get("callerNumber", "") or "").strip()
              if supplied:
                  return supplied
              contact = (event.get("Details") or {}).get("ContactData") or {}
              return str(((contact.get("CustomerEndpoint") or {}).get("Address") or "")).strip()


          def _handle_profile_lookup(attributes, event=None):
              """Flow-facing mode: resolve the caller before the conversation starts."""
              number = _caller_number(event or {}, attributes)
              fields = _profile_fields(number)
              print(f"profile lookup: number={'present' if number else 'MISSING'} "
                    f"matched={'yes' if fields.get('firstName') else 'no'}")
              return {
                  "profileFound": "true" if fields.get("firstName") else "false",
                  "profileGreeting": _profile_greeting(fields),
                  "profileSummary": _profile_summary(fields),
                  "profileFirstName": fields.get("firstName", ""),
                  "profileAmount": fields.get("amount", ""),
                  "profileDueDate": fields.get("dueDate", ""),
                  "profileAccountType": fields.get("accountType", ""),
              }


          def _handle_servicing(state, transcript, attributes):
              """Answer about the caller's own account, or hand a request to a person.

              Returns None when the question is not about the caller's account, so the knowledge
              base handles it. Account questions must never be answered from the knowledge base:
              a general FAQ has no idea what this caller owes.
              """
              compact = _despace(_compact(transcript, 200))
              amount = str(attributes.get("profileAmount", "")).strip()
              due = str(attributes.get("profileDueDate", "")).strip()
              known = str(attributes.get("profileFound", "")).lower() == "true"

              if DEFER_REQUEST_RE.search(compact):
                  # A deferral changes the account, so an automated caller must not grant it.
                  state["outcomeDetail"] = "inbound servicing: payment deferral requested"
                  return _complete(state, "payment_assistance_referral",
                                   "รับทราบค่ะ เรื่องขอเลื่อนการชำระต้องให้เจ้าหน้าที่พิจารณา " + HANDOFF_HOLD_TH)

              if BALANCE_RE.search(compact) or DUE_DATE_RE.search(compact):
                  if not known:
                      return {"done": False, "message": PROFILE_UNKNOWN_TH + " " + KB_INVITE_TH}
                  if str(attributes.get("verified", "")).lower() != "true":
                      # Recognised but not verified. Refusing is the whole point of the control, so
                      # the caller is offered a person rather than the figure.
                      return {"done": False, "message": VERIFY_UNVERIFIED_TH + " " + KB_INVITE_TH}
                  if amount and due:
                      spoken = _thai_baht_words(amount) if _looks_amount(amount) else amount
                      return {"done": False,
                              "message": f"ยอดที่ต้องชำระคือ {spoken} ครบกำหนด {due} ค่ะ {KB_INVITE_TH}"}
                  state["outcomeDetail"] = "inbound servicing: account detail unavailable"
                  return _complete(state, "unresolved_needs_human",
                                   "ขออภัยค่ะ ดิฉันยังไม่สามารถดูรายละเอียดบัญชีได้ " + HANDOFF_HOLD_TH)
              return None



          def _trigrams(text):
              compact = re.sub(r"\s+", "", text or "")
              return {compact[i:i + _TRIGRAM_SIZE]
                      for i in range(max(0, len(compact) - _TRIGRAM_SIZE + 1))}


          def _overlap(question, candidate):
              """Fraction of the question's trigrams that appear in the candidate."""
              asked = _trigrams(question)
              if not asked:
                  return 0.0
              return len(asked & _trigrams(candidate)) / len(asked)


          def _kb_sections(excerpt):
              """Split a retrieved document back into its headed sections.

              The excerpt collapses the blank lines that separated sections into runs of
              whitespace, so those runs are the only structure left to split on.
              """
              parts = [part.strip() for part in re.split(r"\s{2,}", excerpt or "") if part.strip()]
              return [part for part in parts if len(part) > 40]


          def _best_section(question, excerpt):
              """Pick the section that actually answers the question, not the whole document.

              Speaking an entire FAQ aloud would bury the answer, so the caller hears one
              section. Returning None means nothing in the document is relevant even though the
              document itself scored above the floor.
              """
              ranked = sorted(((_overlap(question, section), section)
                               for section in _kb_sections(excerpt)), reverse=True)
              if not ranked or ranked[0][0] <= 0:
                  return None
              return ranked[0][1]


          def _kb_lookup(question, session_id):
              """Query the assistant. Returns (answer, citation, session_id) or (None, None, sid)."""
              if not QCONNECT_ASSISTANT_ID:
                  return None, None, session_id
              client = boto3.client("qconnect", region_name=os.environ.get("AWS_REGION", "us-west-2"))
              try:
                  if not session_id:
                      session_id = client.create_session(
                          assistantId=QCONNECT_ASSISTANT_ID,
                          name=f"inbound-{uuid.uuid4().hex[:12]}")["session"]["sessionId"]
                  results = client.query_assistant(assistantId=QCONNECT_ASSISTANT_ID,
                                                   sessionId=session_id,
                                                   queryText=question,
                                                   maxResults=1).get("results", [])
              except Exception as exc:
                  # Swallowing this silently made a permissions failure look like an empty
                  # knowledge base: the caller heard "I have no information" and was escalated,
                  # while the cause was invisible. The caller still gets the handoff, but the
                  # reason is now recoverable from the log.
                  print(f"kb lookup failed: {type(exc).__name__}: {exc}")
                  return None, None, session_id
              if not results or (results[0].get("relevanceScore") or 0) < KB_SCORE_FLOOR:
                  return None, None, session_id
              document = results[0].get("document", {})
              excerpt = (document.get("excerpt") or {}).get("text", "")
              section = _best_section(question, excerpt)
              if not section:
                  return None, None, session_id
              citation = (document.get("title") or {}).get("text", "")
              return _compact(section, KB_ANSWER_LIMIT), citation, session_id


          def _handle_inbound_kb(state, transcript):
              """Answer an inbound question from the knowledge base, or fetch a person."""
              if _classify_wants_human(transcript):
                  return _complete(state, "human_transfer", "รับทราบค่ะ " + HANDOFF_HOLD_TH)

              if not (transcript or "").strip():
                  # Silence, or speech Lex could not transcribe. Asking the knowledge base an
                  # empty question fails validation, so invite the caller to try again.
                  return {"done": False, "message": "ขออภัยค่ะ ดิฉันฟังไม่ชัด " + KB_INVITE_TH}

              servicing = _handle_servicing(state, transcript, state.get("inboundAttributes", {}))
              if servicing is not None:
                  return servicing

              answer, citation, session_id = _kb_lookup(transcript, state.get("kbSessionId"))
              state["kbSessionId"] = session_id
              if not answer:
                  # Escalating is the honest response to a question we cannot ground, and it
                  # reuses the handoff rather than inventing an answer.
                  state["outcomeDetail"] = f"kb miss: {_compact(transcript, 120)}"
                  return _complete(state, "unresolved_needs_human", KB_NO_ANSWER_TH)

              state["kbAnswers"] = state.get("kbAnswers", 0) + 1
              spoken = f"{answer} อ้างอิงจาก{citation}ค่ะ" if citation else answer
              return {"done": False, "message": f"{spoken} {KB_INVITE_TH}"}


          HUMAN_REQUEST_RE = re.compile(
              r"เจ้าหน้าที่|พนักงาน|คนจริง|คุยกับคน|ติดต่อคน|ขอสาย|โอนสาย|ผู้ดูแล"
          )


          def _classify_wants_human(transcript):
              """Deterministic check, before spending a retrieval call on the question.

              The outbound path reaches this intent through the model classifier; inbound asks
              the question directly, and someone who says "I want to speak to a person" should
              not first be read an FAQ.
              """
              return bool(HUMAN_REQUEST_RE.search(_despace(_compact(transcript, 200))))


          ALLOWED_INTENTS = {
              "bank": {"dispute", "declined", "callback", "human", "unknown"} | SHARED_SIGNAL_INTENTS,
              "insurance": {
                  "need_health",
                  "need_life",
                  "need_savings",
                  "appointment",
                  "declined",
                  "callback",
                  "product_question",
                  "human",
                  "unknown",
              } | SHARED_SIGNAL_INTENTS,
              "broker": {
                  "seminar",
                  "consultation",
                  "advice_request",
                  "declined",
                  "callback",
                  "human",
                  "unknown",
              } | SHARED_SIGNAL_INTENTS,
          }


          def _initial_state(scenario):
              return {
                  "version": 1,
                  "scenario": scenario,
                  "stage": {
                      "bank": "verify_identity",
                      "insurance": "qualify_need",
                      "broker": "choose_action",
                  }[scenario],
                  "turn": 0,
                  "identityConfirmed": False,
              }


          def _load_state(attributes, scenario):
              try:
                  state = json.loads(attributes.get("mantleState", "{}"))
              except (TypeError, json.JSONDecodeError):
                  state = {}
              if state.get("scenario") != scenario or not isinstance(state.get("turn"), int):
                  state = _initial_state(scenario)
              return state


          def _compact(text, limit=160):
              return " ".join(str(text or "").strip().split())[:limit]


          def _despace(text):
              """Remove whitespace so ASR word/vowel splitting cannot hide a signal.

              Advanced ASR returns turns such as "ตอนนี้ ไม่มี เงิน จ ่าย"; Thai has no
              inter-word spaces, so stripping them is safe and makes matching reliable.
              """
              return re.sub(r"\s+", "", str(text or ""))


          def _is_yes(text):
              compact = _despace(_compact(text, 80))
              if NO_WORDS.search(compact):
                  return False
              return bool(YES_WORDS.search(compact) or compact in {"ครับ", "ค่ะ", "คะ"})


          def _is_no(text):
              return bool(NO_WORDS.search(_despace(_compact(text, 80))))


          def _identity_no(text):
              return bool(re.search(r"ไม่ใช่|ผิดคน|โทรผิด|ไม่ได้ชื่อ", _despace(_compact(text, 100))))


          def _identity_yes(text):
              compact = _despace(_compact(text, 100))
              return not _identity_no(compact) and bool(YES_WORDS.search(compact) or compact in {"ครับ", "ค่ะ", "คะ"})


          def _payment_type(text):
              compact = _despace(_compact(text, 100))
              matches = []
              if re.search(r"เต็ม|ทั้งหมด|ชำระหมด|จ่ายหมด", compact):
                  matches.append("full")
              if re.search(r"บางส่วน|ส่วนหนึ่ง", compact):
                  matches.append("partial")
              if re.search(r"ผ่อน|แบ่ง|งวด", compact):
                  matches.append("installment")
              return matches[0] if len(set(matches)) == 1 else None


          def _looks_datetime(text):
              compact = _despace(_compact(text, 120))
              return len(compact) >= 2 and bool(DATE_WORDS.search(compact) or re.search(r"[0-9๐-๙]{1,2}([:/.-][0-9๐-๙]{1,2})?", compact))


          def _looks_amount(text):
              compact = _despace(_compact(text, 120))
              return len(compact) >= 2 and bool(AMOUNT_WORDS.search(compact))


          POLITE_SUFFIXES = (
              "นะครับผม",
              "นะครับ",
              "นะคะ",
              "ครับผม",
              "ครับ",
              "ค่ะ",
              "คะ",
              "ค่า",
              "จ้า",
              "จ๋า",
              "จ้ะ",
              "ฮะ",
              "นะ",
          )

          RELATIVE_DAY_RE = re.compile(
              r"^(พรุ่งนี้|มะรืนนี้|มะรืน|วันนี้|คืนนี้|เช้านี้|สายนี้|บ่ายนี้|เย็นนี้|"
              r"ต้นเดือน|กลางเดือน|ปลายเดือน|สิ้นเดือน|ต้นสัปดาห์|ปลายสัปดาห์|สัปดาห์|"
              r"เดือนนี้|เดือนหน้า|อีก)"
          )

          DAY_PREFIX_RE = re.compile(r"^(วันจันทร์|วันอังคาร|วันพุธ|วันพฤหัส|วันศุกร์|วันเสาร์|วันอาทิตย์|วัน)")


          def _strip_politeness(value):
              text = re.sub(r"[\s.,!?]+$", "", str(value or "").strip())
              changed = True
              while changed:
                  changed = False
                  for suffix in POLITE_SUFFIXES:
                      if text.endswith(suffix) and len(text) > len(suffix):
                          text = re.sub(r"[\s.,!?]+$", "", text[: -len(suffix)])
                          changed = True
              return text.strip()


          def _date_phrase(value):
              spoken = _strip_politeness(value)
              if not spoken:
                  return ""
              if spoken.startswith("วันที่"):
                  return f"ใน{spoken}"
              if RELATIVE_DAY_RE.match(spoken):
                  return spoken
              if DAY_PREFIX_RE.match(spoken):
                  return f"ใน{spoken}"
              return f"ในวันที่ {spoken}"


          def _safe_model_message(value, fallback):
              message = _compact(value, 220)
              if not message or re.search(r"[0-9]", message):
                  return fallback
              message = re.sub(r"(นะ)?ครับ(ผม)?[\s.]*$", "ค่ะ", message)
              if not message.endswith(("ค่ะ", "คะ")):
                  message += "ค่ะ"
              return message


          def _facts(attributes, state):
              facts = {
                  "customerName": _compact(attributes.get("customerName") or "ลูกค้า", 50),
              }
              if state.get("scenario") == "bank" and state.get("identityConfirmed"):
                  facts["amount"] = _compact(attributes.get("amount"), 40)
                  facts["dueDate"] = _compact(attributes.get("dueDate"), 80)
              return facts


          def _classifier_prompt(scenario, state, transcript, facts):
              shared = "hardship, vulnerability, complaint, do_not_contact"
              descriptions = {
                  "bank": f"dispute, declined, callback, human, unknown, {shared}",
                  "insurance": f"need_health, need_life, need_savings, appointment, declined, callback, product_question, human, unknown, {shared}",
                  "broker": f"seminar, consultation, advice_request, declined, callback, human, unknown, {shared}",
              }
              return (
                  "You classify one Thai customer turn for a short financial-services call. "
                  "Never invent a date, amount, need, or customer fact. Preserve rawValue exactly as a substring of the transcript. "
                  "Return only one JSON object with keys intent, message, rawValue, confidence. "
                  f"Allowed intents: {descriptions[scenario]}. confidence is 0 to 1. "
                  "message is one short natural Thai sentence in female register ending ค่ะ or คะ, with no Arabic digits. "
                  "When the sentence offers choices, separate each option with a comma so the caller hears a pause, "
                  "for example ต้องการความคุ้มครองด้านสุขภาพ, ชีวิต, หรือการออมคะ. A comma is the only punctuation allowed. "
                  f"Scenario={scenario}; stage={state.get('stage')}; facts={json.dumps(facts, ensure_ascii=False)}; "
                  f"transcript={json.dumps(transcript, ensure_ascii=False)}"
              )


          def _extract_json(text):
              compact = str(text or "").strip()
              start, end = compact.find("{"), compact.rfind("}")
              if start < 0 or end <= start:
                  raise ValueError("model did not return JSON")
              value = json.loads(compact[start : end + 1])
              if not isinstance(value, dict):
                  raise ValueError("model JSON is not an object")
              return value


          def _invoke(model_id, prompt):
              started = time.perf_counter()
              response = bedrock.converse(
                  modelId=model_id,
                  messages=[{"role": "user", "content": [{"text": prompt}]}],
                  inferenceConfig={"maxTokens": 220},
              )
              elapsed_ms = round((time.perf_counter() - started) * 1000)
              text = "".join(
                  block.get("text", "")
                  for block in response.get("output", {}).get("message", {}).get("content", [])
              )
              result = _extract_json(text)
              return result, elapsed_ms


          def _classify(scenario, state, transcript, facts):
              prompt = _classifier_prompt(scenario, state, transcript, facts)
              total_ms = 0
              errors = []
              for model_id in (LUNA_MODEL_ID, TERRA_MODEL_ID):
                  try:
                      result, elapsed_ms = _invoke(model_id, prompt)
                      total_ms += elapsed_ms
                      intent = str(result.get("intent", "unknown")).strip()
                      confidence = float(result.get("confidence", 0))
                      raw_value = _compact(result.get("rawValue"), 120)
                      if intent not in ALLOWED_INTENTS[scenario]:
                          raise ValueError("unsupported intent")
                      if raw_value and raw_value not in transcript:
                          raise ValueError("raw value was not verbatim")
                      if confidence < 0.58 and model_id == LUNA_MODEL_ID:
                          continue
                      return {
                          "intent": intent,
                          "message": result.get("message", ""),
                          "rawValue": raw_value,
                          "confidence": confidence,
                          "model": model_id,
                          "latencyMs": total_ms,
                      }
                  except Exception as error:  # noqa: BLE001
                      errors.append(type(error).__name__)
              return {
                  "intent": "unknown",
                  "message": "ขออภัยค่ะ กรุณาพูดคำตอบสั้น ๆ อีกครั้งนะคะ",
                  "rawValue": "",
                  "confidence": 0,
                  "model": "fallback",
                  "latencyMs": total_ms,
                  "errors": errors,
              }


          def _readback(state, field, raw):
              if field == "paymentDate":
                  payment = {
                      "full": "ชำระเต็มจำนวน",
                      "partial": "ชำระบางส่วน",
                      "installment": "แบ่งชำระ",
                  }.get(state.get("paymentType"), "ชำระ")
                  return f"ขอยืนยันนะคะ คุณจะ{payment}{_date_phrase(raw)} ถูกต้องไหมคะ"
              if field == "paymentAmount":
                  payment = "แบ่งชำระ" if state.get("paymentType") == "installment" else "ชำระบางส่วน"
                  when = _date_phrase(state.get("paymentDate"))
                  amount = _strip_politeness(raw)
                  return f"ขอยืนยันนะคะ คุณจะ{payment}{when} จำนวน {amount} ถูกต้องไหมคะ"
              if field == "preferredTime":
                  return f"ขอยืนยันเวลานัดหมาย {_strip_politeness(raw)} ถูกต้องไหมคะ"
              return f"ขอยืนยันเวลาที่ให้โทรกลับ {_strip_politeness(raw)} ถูกต้องไหมคะ"


          def _ask_for(field):
              return {
                  "paymentDate": "กรุณาระบุวันที่สะดวกชำระค่ะ",
                  "paymentAmount": "กรุณาระบุจำนวนเงินงวดแรกค่ะ",
                  "preferredTime": "กรุณาระบุวัน, หรือเวลาที่สะดวกนัดหมายค่ะ",
                  "callbackTime": "กรุณาระบุวัน, หรือเวลาที่สะดวกให้โทรกลับค่ะ",
              }[field]


          THAI_NUM_PART = (
              r"(?:[0-9๐-๙]+|ยี่|เอ็ด|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)"
          )
          # ASR splits spoken numbers ("ห้า พัน บาท"), so allow spaces between the parts.
          THAI_NUM = rf"(?:{THAI_NUM_PART}(?:\s*{THAI_NUM_PART})*)"
          MONTHS = (
              r"(?:มกรา(?:คม)?|กุมภา(?:พันธ์)?|มีนา(?:คม)?|เมษา(?:ยน)?|พฤษภา(?:คม)?|มิถุนา(?:ยน)?|"
              r"กรกฎา(?:คม)?|สิงหา(?:คม)?|กันยา(?:ยน)?|ตุลา(?:คม)?|พฤศจิกา(?:ยน)?|ธันวา(?:คม)?)"
          )
          WEEKDAYS = r"(?:จันทร์|อังคาร|พุธ|พฤหัสบดี|พฤหัส|ศุกร์|เสาร์|อาทิตย์)"
          DAY_PERIOD = r"(?:เช้า|สาย|เที่ยง|บ่าย|เย็น|ค่ำ|กลางวัน|กลางคืน)"
          CLOCK = rf"(?:{THAI_NUM}\s*(?:โมง|ทุ่ม|นาฬิกา)(?:\s*(?:ครึ่ง|{THAI_NUM}\s*นาที))?(?:\s*{DAY_PERIOD})?)"

          DATE_PATTERNS = (
              rf"วันที่\s*{THAI_NUM}(?:\s*{MONTHS})?",
              rf"{THAI_NUM}\s*{MONTHS}",
              r"(?:วัน)?มะรืนนี้|(?:วัน)?มะรืน",
              r"(?:วัน)?พรุ่งนี้",
              r"วันนี้",
              rf"วัน{WEEKDAYS}(?:หน้า|นี้)?",
              rf"{WEEKDAYS}(?:หน้า|นี้)?",
              r"(?:ต้น|กลาง|ปลาย|สิ้น)(?:เดือน|สัปดาห์)(?:นี้|หน้า)?",
              r"(?:เดือน|สัปดาห์)(?:นี้|หน้า)",
              rf"อีก\s*{THAI_NUM}\s*(?:วัน|สัปดาห์|เดือน)",
          )
          TIME_PATTERNS = (
              CLOCK,
              rf"{DAY_PERIOD}\s*{THAI_NUM}(?:\s*โมง)?(?:\s*ครึ่ง)?",
              rf"{DAY_PERIOD}นี้",
              DAY_PERIOD,
          )
          AMOUNT_PATTERN = rf"{THAI_NUM}(?:\s*(?:จุด|\.)\s*{THAI_NUM})?\s*บาท"


          def _first_match(patterns, text):
              best = None
              for pattern in patterns:
                  found = re.search(pattern, text)
                  if found and (best is None or found.start() < best.start()):
                      best = found
              return best


          # Bare อาทิตย์ followed by หน้า/นี้ means "week", so prefixing วัน would turn
          # "next week" into "next Sunday".
          WEEK_WORD_RE = re.compile(r"^อาทิตย์(?:หน้า|นี้|ก่อน)")
          SPECIFIC_WEEKDAYS = r"(?:จันทร์|อังคาร|พุธ|พฤหัสบดี|พฤหัส|ศุกร์|เสาร์)"
          SPECIFIC_WHEN_RE = re.compile(
              rf"วันที่|{MONTHS}|พรุ่งนี้|มะรืน|วันนี้|วันอาทิตย์|{SPECIFIC_WEEKDAYS}"
          )


          def _normalise_when(value):
              spoken = value.strip()
              if WEEK_WORD_RE.match(spoken):
                  return spoken
              if re.match(rf"^{WEEKDAYS}", spoken):
                  spoken = "วัน" + spoken
              return spoken


          def _extract_when(text):
              """Return only the date/time expression, not the customer's whole sentence."""
              spoken = _strip_politeness(text)
              spans = []
              for pattern in DATE_PATTERNS + TIME_PATTERNS:
                  for hit in re.finditer(pattern, spoken):
                      spans.append((hit.start(), hit.end(), pattern in DATE_PATTERNS))
              if not spans:
                  return spoken
              spans.sort()
              clusters = [[spans[0][0], spans[0][1], spans[0][2]]]
              for start, end, is_date in spans[1:]:
                  current = clusters[-1]
                  if start - current[1] <= 3:
                      current[1] = max(current[1], end)
                      current[2] = current[2] or is_date
                  else:
                      clusters.append([start, end, is_date])
              dated = [c for c in clusters if c[2]] or clusters
              specific = [c for c in dated if SPECIFIC_WHEN_RE.search(spoken[c[0] : c[1]])]
              best = max(specific or dated, key=lambda c: c[1] - c[0])
              if best[1] - best[0] > 40:
                  best[1] = best[0] + 40
              return _normalise_when(re.sub(r"\s+", " ", spoken[best[0] : best[1]]))


          def _extract_amount(text):
              """Return only the amount expression, not the customer's whole sentence."""
              spoken = _strip_politeness(text)
              found = re.search(AMOUNT_PATTERN, spoken)
              if found:
                  return re.sub(r"\s+", " ", found.group()).strip()
              number = re.search(THAI_NUM, spoken)
              return number.group().strip() if number else spoken


          def _set_pending(state, field, raw):
              extractor = _extract_amount if field == "paymentAmount" else _extract_when
              state["pending"] = {"field": field, "raw": _compact(extractor(raw), 120)}
              return _readback(state, field, state["pending"]["raw"])


          def _complete(state, outcome_type, message):
              state["stage"] = "closed"
              state["outcomeType"] = outcome_type
              return {
                  "done": True,
                  "message": message,
                  "outcomeType": outcome_type,
                  "paymentType": state.get("paymentType", "unspecified"),
                  "paymentDate": state.get("paymentDate", "unspecified"),
                  "paymentAmount": state.get("paymentAmount", "unspecified"),
                  "productInterest": state.get("productInterest", "unspecified"),
                  "preferredTime": state.get("preferredTime") or state.get("callbackTime", "unspecified"),
                  "topicInterest": state.get("topicInterest", "general_market_update"),
                  "customerGoal": state.get("customerGoal", "unspecified"),
                  "experienceLevel": state.get("experienceLevel", "unspecified"),
                  "outcomeDetail": _detail_with_signal(state, message),
                  "handoffRequired": "true" if outcome_type in HANDOFF_OUTCOMES else "false",
                  "handoffReason": HANDOFF_REASON_TH.get(outcome_type, ""),
                  "handoffSummary": _handoff_summary(state, outcome_type),
              }


          def _handoff_summary(state, outcome_type):
              """A short Thai briefing so the agent does not restart the conversation.

              Everything here was already gathered during discovery. Without it the agent
              receives a bare transfer and asks the customer the same questions again, which
              is the failure the handoff is meant to remove. Kept compact because it is read
              aloud in the whisper and shown in a narrow CCP panel.
              """
              if outcome_type not in HANDOFF_OUTCOMES:
                  return ""
              scenario = SCENARIO_TH.get(state.get("scenario"), state.get("scenario") or "-")
              parts = [f"งาน{scenario}", HANDOFF_REASON_TH.get(outcome_type, outcome_type)]
              inbound = state.get("inboundAttributes") or {}
              if inbound.get("profileFirstName"):
                  parts.append(f"ลูกค้า {inbound['profileFirstName']}")
              for label, value in (
                  ("สนใจ", state.get("productInterest") or state.get("topicInterest")),
                  ("เป้าหมาย", state.get("customerGoal")),
                  ("ประสบการณ์", state.get("experienceLevel")),
                  ("ยอด", state.get("paymentAmount")),
                  ("กำหนด", state.get("paymentDate")),
                  ("สะดวกให้ติดต่อ", state.get("preferredTime") or state.get("callbackTime")),
              ):
                  if value and value != "unspecified":
                      parts.append(f"{label} {value}")
              signal = state.get("primarySignal")
              if signal:
                  parts.append(f"สัญญาณ {signal}")
              return _compact(" | ".join(parts), 260)


          def _detail_with_signal(state, message):
              detail = state.get("outcomeDetail", message)
              signal = state.get("primarySignal")
              if POLICY_V2 and signal and "signal=" not in detail:
                  detail = f"signal={signal}; {detail}"
              return detail


          def _after_confirmation(state):
              pending = state.pop("pending")
              field, raw = pending["field"], pending["raw"]
              state[field] = raw
              scenario = state["scenario"]
              if scenario == "bank":
                  hardship = POLICY_V2 and state.get("primarySignal") == "hardship"
                  if (field == "paymentDate" and state.get("paymentType") in {"partial", "installment"}
                          and not state.get("paymentAmount")):
                      state["stage"] = "payment_amount"
                      return {"done": False, "message": _ask_for("paymentAmount")}
                  if field == "paymentAmount" and hardship and not state.get("paymentDate"):
                      state["stage"] = "paymentDate"
                      return {"done": False, "message": _ask_for("paymentDate")}
                  if field in {"paymentDate", "paymentAmount"}:
                      if hardship:
                          state["outcomeDetail"] = "signal=hardship; partial payment agreed"
                          return _complete(state, "partial_payment_agreement",
                                           "ยืนยันแผนชำระบางส่วนเรียบร้อยแล้ว "
                                           "จะส่งเรื่องให้ทีมช่วยเหลือตรวจสอบต่อและติดต่อกลับค่ะ")
                      state["outcomeDetail"] = "confirmed payment commitment"
                      return _complete(state, "payment_commitment", "ยืนยันแผนการชำระเรียบร้อยแล้ว ขอบคุณค่ะ")
              if field == "callbackTime":
                  state["outcomeDetail"] = f"callback {raw}"
                  return _complete(state, "callback", "ยืนยันเวลาติดต่อกลับเรียบร้อยแล้ว ขอบคุณค่ะ")
              if scenario == "insurance" and field == "preferredTime":
                  state["outcomeDetail"] = (
                      f"need={state.get('productInterest', 'unspecified')}; "
                      f"customer_priority={state.get('customerGoal', 'unspecified')}; licensed agent appointment {raw}"
                  )
                  return _complete(state, "appointment", "ยืนยันเวลานัดหมายกับเจ้าหน้าที่ผู้ได้รับอนุญาตแล้ว ขอบคุณค่ะ")
              if scenario == "broker" and field == "preferredTime":
                  topic, experience = _broker_discovery_summary(state)
                  state["outcomeDetail"] = f"topic={topic}; experience={experience}; licensed consultant appointment {raw}"
                  return _complete(state, "consultation", "ยืนยันเวลานัดหมายกับผู้แนะนำการลงทุนแล้ว ขอบคุณค่ะ")
              return {"done": False, "message": "กรุณาระบุข้อมูลต่อค่ะ"}


          # SUDA does not pause on a plain space between Thai clauses, so enumerated
          # choices ran together as one word ("เต็มจำนวนชำระบางส่วนหรือแบ่งชำระ"). A comma
          # produces an audible break and is not spoken aloud. The flow renders prompts as
          # plain text, so SSML <break> is unavailable.
          OPTION_PAUSE = ", "


          def _spoken_options(options):
              """Join spoken choices so the caller hears a pause between each one."""
              items = [str(option).strip() for option in options if str(option).strip()]
              if not items:
                  return ""
              if len(items) == 1:
                  return items[0]
              return OPTION_PAUSE.join(items[:-1]) + OPTION_PAUSE + "หรือ" + items[-1]


          # Bank resolves every ask with deterministic Thai matching. Insurance and
          # securities previously depended on the classifier for the same job, so a weak
          # model reply produced a statement instead of a question and the call stalled.
          # These matchers give all three scenarios the same baseline.
          INSURANCE_NEED_MATCHERS = (
              ("need_health", re.compile(r"สุขภาพ|ค่ารักษา|โรงพยาบาล|เจ็บป่วย|รักษาพยาบาล|โรคร้าย|ค่าหมอ")),
              ("need_life", re.compile(r"คุ้มครองชีวิต|ประกันชีวิต|ชีวิต|ครอบครัว|มรดก|คนข้างหลัง")),
              ("need_savings", re.compile(r"ออม|สะสมทรัพย์|เกษียณ|บำนาญ|ลงทุนระยะยาว|เก็บเงิน")),
          )
          BROKER_ACTION_MATCHERS = (
              ("advice_request", re.compile(r"แนะนำหุ้น|หุ้นตัวไหน|หุ้นอะไร|ควรซื้อ|ควรขาย|ซื้อตัวไหน|ราคาเป้าหมาย")),
              ("consultation", re.compile(r"นัดคุย|นัดหมาย|ปรึกษา|คุยกับผู้แนะนำ|พบผู้แนะนำ|เจอผู้แนะนำ")),
              ("seminar", re.compile(r"สัมมนา|รายละเอียด|ข้อมูลเพิ่ม|ส่งมา|อีเมล|ไลน์|สนใจ|เอาครับ|เอาค่ะ")),
          )
          BROKER_TOPIC_MATCHERS = (
              ("starting_investing", re.compile(r"เริ่มลงทุน|มือใหม่|พื้นฐาน|ยังไม่เคยลงทุน|เริ่มศึกษา")),
              ("portfolio_diversification", re.compile(r"กระจาย|จัดพอร์ต|พอร์ตลงทุน|หลายสินทรัพย์")),
              ("retirement_planning", re.compile(r"เกษียณ|ระยะยาว|เงินหลังเกษียณ")),
              ("market_education", re.compile(r"ตลาด|เศรษฐกิจ|ปัจจัยตลาด|ความผันผวน|สัมมนา")),
          )
          BROKER_EXPERIENCE_MATCHERS = (
              ("experienced", re.compile(r"ลงทุนมานาน|หลายปี|ประสบการณ์|ลงทุนประจำ")),
              ("new_investor", re.compile(r"ยังไม่เคย|มือใหม่|เพิ่งเริ่ม|เริ่มศึกษา|ไม่มีประสบการณ์")),
              ("some_experience", re.compile(r"เคยลงทุน|มีพอร์ต|ลงทุนอยู่|เคยซื้อ|เคยขาย")),
          )
          # A refusal must never be read as interest in the seminar.
          BROKER_DECLINE_RE = re.compile(r"ไม่สนใจ|ไม่เอา|ไม่ต้อง|ไม่ว่าง|ไม่สะดวก|ยังไม่")


          def _match_first(matchers, text):
              compact = _despace(_compact(text, 200))
              for name, pattern in matchers:
                  if pattern.search(compact):
                      return name
              return None


          def _insurance_need(text):
              return _match_first(INSURANCE_NEED_MATCHERS, text)


          def _broker_action(text):
              if BROKER_DECLINE_RE.search(_despace(_compact(text, 200))):
                  return None
              return _match_first(BROKER_ACTION_MATCHERS, text)


          def _broker_topic(text):
              return _match_first(BROKER_TOPIC_MATCHERS, text)


          def _broker_experience(text):
              return _match_first(BROKER_EXPERIENCE_MATCHERS, text)


          # A caller asking us to repeat is not a request for a human.
          REPEAT_RE = re.compile(
              r"ขอใหม่|อีกครั้ง|อีกรอบ|พูดอีก|ขอซ้ำ|ไม่ได้ยิน|ยังไม่ได้ยิน|เสียงหาย|เสียงขาด|"
              r"เสียงไม่ชัด|ฟังไม่ทัน|พูดช้า|ช้าลง"
          )

          BANK_PAYMENT_CHOICES = ("ชำระเต็มจำนวน", "ชำระบางส่วน", "แบ่งชำระ")
          BANK_HARDSHIP_CHOICES = ("ชำระบางส่วนก่อน", "ขอเลื่อนการชำระออกไป")
          BANK_ASSISTANCE_CHOICES = ("ลดค่างวดชั่วคราว", "พักชำระเงินต้น", "ขยายระยะเวลาผ่อนชำระ")
          BANK_ASSISTANCE_MATCHERS = (
              ("reduce_installment", re.compile(r"ลดค่างวด|ลดงวด|ค่างวดน้อย|จ่ายน้อยลง|ลดยอดผ่อน|ลดการผ่อน")),
              ("principal_holiday", re.compile(r"พักชำระเงินต้น|พักเงินต้น|เงินต้น|พักชำระ|พักหนี้|พักก่อน")),
              ("extend_term", re.compile(r"ขยายระยะเวลา|ขยายเวลา|ยืดเวลา|ผ่อนนานขึ้น|เพิ่มงวด|ยืดงวด")),
          )
          ASSISTANCE_PLAN_TH = {
              "reduce_installment": "ลดค่างวดชั่วคราว",
              "principal_holiday": "พักชำระเงินต้น",
              "extend_term": "ขยายระยะเวลาผ่อนชำระ",
          }


          def _assistance_plan(text):
              return _match_first(BANK_ASSISTANCE_MATCHERS, text)
          INSURANCE_NEED_CHOICES = ("สุขภาพ", "ชีวิต", "การออม")
          BROKER_ACTION_CHOICES = ("สนใจรับรายละเอียดสัมมนา", "นัดคุยกับผู้แนะนำการลงทุน")
          BROKER_TOPIC_CHOICES = ("พื้นฐานการลงทุน", "การกระจายพอร์ต", "การวางแผนเกษียณ", "ความรู้เรื่องตลาด")

          INSURANCE_DISCOVERY = {
              "health_rider": (
                  "ความคุ้มครองสุขภาพอาจช่วยวางแผนค่าใช้จ่ายที่เป็นไปตามเงื่อนไขกรมธรรม์",
                  "สิ่งที่อยากให้เจ้าหน้าที่ช่วยดูเป็นหลักคือค่ารักษา, โรคร้ายแรง, หรือความคุ้มครองที่มีอยู่คะ",
              ),
              "life_topup": (
                  "ความคุ้มครองชีวิตอาจช่วยวางแผนเงินให้ผู้รับประโยชน์ตามเงื่อนไขกรมธรรม์",
                  "สิ่งที่ให้ความสำคัญเป็นหลักคือครอบครัว, ภาระหนี้สิน, หรือเงินสำรองคะ",
              ),
              "savings_insurance": (
                  "ประกันเพื่อการออมรวมความคุ้มครองกับการออมตามเงื่อนไขกรมธรรม์",
                  "เป้าหมายหลักคือเงินสำรอง, การเกษียณ, หรือวินัยการออมคะ",
              ),
          }
          BROKER_TOPIC_LABELS = {
              "starting_investing": "พื้นฐานการลงทุน",
              "portfolio_diversification": "การกระจายพอร์ต",
              "retirement_planning": "การวางแผนเกษียณ",
              "market_education": "ความรู้เรื่องตลาด",
              "customer_stated_topic": "หัวข้อที่แจ้งไว้",
          }
          BROKER_APPROVED_FACTS = {
              "starting_investing": "การเริ่มลงทุนควรพิจารณาเป้าหมาย, ระยะเวลา, และความเสี่ยงที่ยอมรับได้ก่อนค่ะ",
              "portfolio_diversification": "การกระจายการลงทุนช่วยลดการพึ่งพาสินทรัพย์เดียว แต่ไม่ป้องกันการขาดทุนทั้งหมดค่ะ",
              "retirement_planning": "การลงทุนเพื่อเกษียณควรพิจารณาระยะเวลาและความผันผวน โดยผู้แนะนำการลงทุนต้องประเมินความเหมาะสมค่ะ",
              "market_education": "ข้อมูลสัมมนาอธิบายปัจจัยตลาดเพื่อการศึกษา ไม่ใช่การคาดการณ์ผลตอบแทนค่ะ",
          }
          DISCOVERY_FILLER_RE = re.compile(r"^(?:อือ|เอ่อ|อ่า|อืม|ครับ|ค่ะ|คะ|ไม่รู้|ยังไม่แน่ใจ)$")


          def _customer_words(text, limit=100):
              words = _strip_politeness(_compact(text, limit)).strip(" .,!?ๆ")
              return "" if not words or DISCOVERY_FILLER_RE.fullmatch(_despace(words)) else words


          def _insurance_discovery_prompt(product_interest):
              fact, question = INSURANCE_DISCOVERY[product_interest]
              return f"{fact}ค่ะ {question}"


          def _broker_topic_prompt(topic, customer_topic=""):
              fact = BROKER_APPROVED_FACTS.get(topic)
              if fact:
                  return f"{fact} คุณเคยลงทุนมาก่อน, หรือกำลังเริ่มศึกษาคะ"
              return f"รับทราบว่าคุณสนใจเรื่อง{customer_topic}ค่ะ คุณเคยลงทุนมาก่อน, หรือกำลังเริ่มศึกษาคะ"


          def _broker_discovery_summary(state):
              topic = state.get("customerTopic") or BROKER_TOPIC_LABELS.get(state.get("topicInterest"), "การลงทุน")
              experience = state.get("customerExperience") or {
                  "new_investor": "กำลังเริ่มศึกษา",
                  "some_experience": "มีประสบการณ์ลงทุนบ้าง",
                  "experienced": "มีประสบการณ์ลงทุน",
              }.get(state.get("experienceLevel"), "ยังไม่ได้ระบุประสบการณ์")
              return topic, experience


          def _detect_signal(text):
              """Return the highest-priority customer signal present in the turn."""
              compact = _despace(_compact(text, 240))
              for name, pattern in SIGNAL_PATTERNS:
                  if pattern.search(compact):
                      return name
              return None


          def _apply_signal(state, signal, scenario):
              """Handle a shared signal before the ordinary slot-filling flow.

              Returns None when the scenario handler should process the turn instead.
              """
              state["primarySignal"] = signal
              if signal == "do_not_contact":
                  state["outcomeDetail"] = "signal=do_not_contact; contact ban requested"
                  return _complete(state, "do_not_contact",
                                   "รับทราบค่ะ จะบันทึกคำขอไม่ให้ติดต่ออีกและขอยุติการโทรค่ะ")
              if signal == "vulnerability":
                  state["outcomeDetail"] = "signal=vulnerability; specialist review required"
                  return _complete(state, "vulnerability_referral",
                                   "รับทราบค่ะ ขอดูแลเป็นกรณีพิเศษ " + HANDOFF_HOLD_TH)
              if signal == "complaint":
                  state["outcomeDetail"] = "signal=complaint; complaint logged"
                  return _complete(state, "complaint_logged",
                                   "ขออภัยค่ะ จะบันทึกข้อร้องเรียนไว้ " + HANDOFF_HOLD_TH)
              # hardship
              if scenario == "bank":
                  if not state.get("identityConfirmed"):
                      return None
                  # Already inside a hardship branch: fall through so the stage handler reads the
                  # answer. Without assistance_options here, a caller naming a relief option --
                  # "ขอลดค่างวด" also matches the hardship pattern -- re-entered this function and
                  # heard the menu again instead of being understood.
                  if state.get("stage") in {"hardship_options", "assistance_options"}:
                      return None
                  if ASSISTANCE_PROGRAM:
                      # The first reply to hardship is the one that matters. Offering only ways to
                      # pay here is what made the agent feel like it was still chasing money.
                      state["stage"] = "assistance_options"
                      state["outcomeDetail"] = "signal=hardship; assistance options offered"
                      return {"done": False,
                              "message": "เข้าใจสถานการณ์ค่ะ ขอบคุณที่แจ้งให้ทราบ "
                                         "ธนาคารมีแนวทางช่วยเหลือด้านการชำระอยู่ค่ะ "
                                         f"สนใจแบบ{_spoken_options(BANK_ASSISTANCE_CHOICES)}คะ "
                                         "หากสะดวกชำระบางส่วนก่อนก็แจ้งได้ค่ะ"}
                  state["stage"] = "hardship_options"
                  return {"done": False,
                          "message": "รับทราบค่ะ ขอบคุณที่แจ้งให้ทราบ "
                                     f"ขณะนี้สะดวก{_spoken_options(BANK_HARDSHIP_CHOICES)}คะ"}
              if scenario == "insurance":
                  state["outcomeDetail"] = "signal=hardship; affordability review requested"
                  return _complete(state, "affordability_review",
                                   "รับทราบค่ะ เรื่องนี้ต้องให้เจ้าหน้าที่ผู้ได้รับอนุญาตทบทวนค่ะ " + HANDOFF_HOLD_TH)
              state["outcomeDetail"] = "signal=hardship; licensed representative review required"
              return _complete(state, "licensed_rep_referral",
                               "รับทราบค่ะ เรื่องนี้ต้องให้ผู้แนะนำการลงทุนที่ได้รับอนุญาตดูแลค่ะ " + HANDOFF_HOLD_TH)


          DEFER_RE = re.compile(r"ขอผ่อนผัน|พักชำระ|พักหนี้|เลื่อน|ไม่ไหว|ไม่ได้เลย|ไม่มีจริง|ยังไม่ได้|ไม่มีเลย")
          PARTIAL_RE = re.compile(r"บางส่วน|บ้าง|เท่าที่|พอจ่าย|จ่ายได้|ผ่อน|แบ่ง")


          def _handle_hardship_options(state, transcript):
              """Bank hardship branch: capture a partial offer or refer for assistance."""
              compact = _despace(_compact(transcript, 200))
              if DEFER_RE.search(compact) and not _looks_amount(compact):
                  if ASSISTANCE_PROGRAM:
                      # The caller cannot pay. That is the moment to describe the relief that
                      # exists, not to hand the conversation to someone else.
                      state["stage"] = "assistance_options"
                      state["outcomeDetail"] = "signal=hardship; assistance options offered"
                      return {"done": False,
                              "message": "เข้าใจสถานการณ์ค่ะ ธนาคารมีแนวทางช่วยเหลือด้านการชำระอยู่ค่ะ "
                                         f"สนใจแบบ{_spoken_options(BANK_ASSISTANCE_CHOICES)}คะ"}
                  state["outcomeDetail"] = "signal=hardship; payment assistance review requested"
                  return _complete(state, "payment_assistance_referral",
                                   "รับทราบค่ะ จะส่งเรื่องให้ทีมช่วยเหลือด้านการชำระตรวจสอบแนวทางผ่อนผันค่ะ "
                                   + HANDOFF_HOLD_TH)
              if PARTIAL_RE.search(compact) or _looks_amount(compact):
                  state["paymentType"] = "partial"
                  if _looks_amount(compact):
                      return {"done": False, "message": _set_pending(state, "paymentAmount", compact)}
                  state["stage"] = "payment_amount"
                  return {"done": False, "message": _ask_for("paymentAmount")}
              return {"done": False,
                      "message": f"สะดวก{_spoken_options(BANK_HARDSHIP_CHOICES)}คะ"}


          def _handle_assistance_options(state, transcript):
              """Capture which assistance option the caller wants, without approving it.

              The agent may describe the programme and record a request; only a person can
              approve one. The wording therefore commits to a follow-up, never to an outcome.
              """
              compact = _despace(_compact(transcript, 200))
              # Never trap a caller in self-service. Asking for a person always works.
              if _classify_wants_human(transcript):
                  return _complete(state, "human_transfer", "รับทราบค่ะ " + HANDOFF_HOLD_TH)
              plan = _assistance_plan(transcript)
              if plan:
                  state["assistancePlan"] = plan
                  label = ASSISTANCE_PLAN_TH[plan]
                  state["outcomeDetail"] = f"signal=hardship; assistance requested: {plan}"
                  return _complete(state, "assistance_plan_requested",
                                   f"รับทราบค่ะ จะบันทึกคำขอ{label}ไว้ให้ค่ะ "
                                   "ทีมช่วยเหลือด้านการชำระจะติดต่อกลับเพื่อยืนยันเงื่อนไขและเอกสาร "
                                   "โดยผลการพิจารณาขึ้นอยู่กับการตรวจสอบของธนาคารค่ะ")
              # A caller who can pay something after hearing the options is back on the
              # ordinary partial-payment path.
              if PARTIAL_RE.search(compact) or _looks_amount(compact):
                  state["paymentType"] = "partial"
                  if _looks_amount(compact):
                      return {"done": False, "message": _set_pending(state, "paymentAmount", compact)}
                  state["stage"] = "payment_amount"
                  return {"done": False, "message": _ask_for("paymentAmount")}
              # Repeating the menu forever is its own kind of unhelpful, so the second miss
              # degrades to the human referral this branch used to reach immediately.
              if state.get("assistanceAsked"):
                  state["outcomeDetail"] = "signal=hardship; assistance option unclear"
                  return _complete(state, "payment_assistance_referral",
                                   "ขออภัยค่ะ เพื่อให้ได้แนวทางที่เหมาะที่สุด "
                                   + HANDOFF_HOLD_TH)
              state["assistanceAsked"] = "true"
              return {"done": False,
                      "message": f"สนใจแบบ{_spoken_options(BANK_ASSISTANCE_CHOICES)}คะ"}


          def _handle_pending(state, transcript):
              pending = state.get("pending")
              if not pending:
                  return None
              if _is_yes(transcript):
                  return _after_confirmation(state)
              if _is_no(transcript):
                  field = pending["field"]
                  state.pop("pending", None)
                  state["stage"] = field
                  return {"done": False, "message": _ask_for(field)}
              field = pending["field"]
              # A caller who restates a different date or amount is correcting the read-back,
              # not failing to answer it. Re-capture rather than repeating the same sentence.
              if field == "paymentAmount":
                  if _looks_amount(transcript):
                      candidate = _compact(_extract_amount(transcript), 120)
                      if candidate and candidate != pending["raw"]:
                          return {"done": False, "message": _set_pending(state, field, transcript)}
              elif _looks_datetime(transcript):
                  candidate = _compact(_extract_when(transcript), 120)
                  if candidate and candidate != pending["raw"]:
                      return {"done": False, "message": _set_pending(state, field, transcript)}
              return {"done": False, "message": _readback(state, field, pending["raw"])}


          def _common_intent(state, classified):
              intent = classified["intent"]
              if intent == "declined":
                  return _complete(state, "declined", "รับทราบค่ะ ขอบคุณที่สละเวลาค่ะ")
              if intent == "human":
                  return _complete(state, "human_transfer", "รับทราบค่ะ " + HANDOFF_HOLD_TH)
              if intent == "callback":
                  raw = classified.get("rawValue", "")
                  if raw and _looks_datetime(raw):
                      return {"done": False, "message": _set_pending(state, "callbackTime", raw)}
                  state["stage"] = "callbackTime"
                  return {"done": False, "message": _ask_for("callbackTime")}
              return None


          def _handle_bank(state, transcript, classified, attributes):
              stage = state["stage"]
              if stage == "verify_identity":
                  if _identity_no(transcript):
                      return _complete(state, "unavailable", "ขออภัยที่รบกวนค่ะ ขอบคุณค่ะ")
                  if _identity_yes(transcript):
                      state["identityConfirmed"] = True
                      state["stage"] = "payment_type"
                      amount_spoken = _thai_baht_words(attributes.get("amount"))
                      due_date = _compact(attributes.get("dueDate") or "วันที่แจ้ง", 80)
                      customer_name = _compact(attributes.get("customerName") or "", 80)
                      if customer_name.startswith("คุณ"):
                          customer_address = customer_name
                      else:
                          customer_address = f"คุณ{customer_name}" if customer_name else "คุณลูกค้า"
                      return {"done": False, "message": f"ขอบคุณที่ยืนยันตัวนะคะ {customer_address} ขณะนี้มียอดที่ต้องชำระ {amount_spoken} ครบกำหนด {due_date} ค่ะ สะดวก{_spoken_options(BANK_PAYMENT_CHOICES)}คะ"}
                  return {"done": False, "message": "ขอเรียนยืนยันว่ากำลังเรียนสายเจ้าของชื่อที่แจ้งไว้หรือไม่คะ"}
              if POLICY_V2 and stage == "hardship_options":
                  return _handle_hardship_options(state, transcript)
              if POLICY_V2 and stage == "assistance_options":
                  return _handle_assistance_options(state, transcript)
              common = _common_intent(state, classified)
              if common:
                  return common
              if classified["intent"] == "dispute":
                  return _complete(state, "dispute", "รับทราบข้อโต้แย้งค่ะ จะให้เจ้าหน้าที่ตรวจสอบข้อมูลต่อค่ะ")
              if stage == "payment_type":
                  value = _payment_type(transcript)
                  if not value:
                      return {"done": False, "message": f"สะดวก{_spoken_options(BANK_PAYMENT_CHOICES)}คะ"}
                  state["paymentType"] = value
                  state["stage"] = "paymentDate"
                  return {"done": False, "message": _ask_for("paymentDate")}
              if stage in {"payment_date", "paymentDate"}:
                  if _looks_datetime(transcript):
                      return {"done": False, "message": _set_pending(state, "paymentDate", transcript)}
                  return {"done": False, "message": _ask_for("paymentDate")}
              if stage in {"payment_amount", "paymentAmount"}:
                  if _looks_amount(transcript):
                      return {"done": False, "message": _set_pending(state, "paymentAmount", transcript)}
                  return {"done": False, "message": _ask_for("paymentAmount")}
              if stage in {"callback_time", "callbackTime"}:
                  if _looks_datetime(transcript):
                      return {"done": False, "message": _set_pending(state, "callbackTime", transcript)}
                  return {"done": False, "message": _ask_for("callbackTime")}
              return {"done": False, "message": "กรุณาตอบคำถามสั้น ๆ อีกครั้งค่ะ"}


          def _handle_insurance(state, transcript, classified):
              common = _common_intent(state, classified)
              if common:
                  return common
              if classified["intent"] == "product_question":
                  return _complete(
                      state,
                      "product_question",
                      "รายละเอียดผลิตภัณฑ์และความเหมาะสมต้องให้เจ้าหน้าที่ผู้ได้รับอนุญาตดูแลค่ะ",
                  )
              stage = state["stage"]
              if stage == "qualify_need":
                  mapping = {
                      "need_health": "health_rider",
                      "need_life": "life_topup",
                      "need_savings": "savings_insurance",
                  }
                  need = _insurance_need(transcript) or (
                      classified["intent"] if classified["intent"] in mapping else None)
                  if need in mapping:
                      state["productInterest"] = mapping[need]
                      state["stage"] = "discover_priority"
                      return {"done": False, "message": _insurance_discovery_prompt(mapping[need])}
                  return {"done": False, "message": f"ต้องการความคุ้มครองด้าน{_spoken_options(INSURANCE_NEED_CHOICES)}คะ"}
              if stage == "discover_priority":
                  priority = _customer_words(transcript)
                  if not priority:
                      return {"done": False, "message": INSURANCE_DISCOVERY[state["productInterest"]][1]}
                  state["customerGoal"] = priority
                  state["stage"] = "offer_handoff"
                  return {
                      "done": False,
                      "message": (
                          f"รับทราบค่ะ ประเด็นสำคัญคือ{priority} "
                          "ต้องการให้เจ้าหน้าที่ผู้ได้รับอนุญาตตรวจสอบทางเลือกและเงื่อนไขจริงให้ไหมคะ"
                      ),
                  }
              if stage == "offer_handoff":
                  if _is_no(transcript) or classified["intent"] == "declined":
                      return _complete(state, "declined", "รับทราบค่ะ ขอบคุณที่ให้ข้อมูลและขอบคุณที่สละเวลาค่ะ")
                  if _looks_datetime(transcript):
                      return {"done": False, "message": _set_pending(state, "preferredTime", transcript)}
                  if _is_yes(transcript) or classified["intent"] == "appointment":
                      state["stage"] = "preferredTime"
                      return {"done": False, "message": "สะดวกให้เจ้าหน้าที่ผู้ได้รับอนุญาตติดต่อวันใดและเวลาใดคะ"}
                  return {"done": False, "message": "ต้องการให้เจ้าหน้าที่ผู้ได้รับอนุญาตติดต่อเพื่อดูรายละเอียดต่อไหมคะ"}
              if stage in {"preferred_time", "preferredTime", "appointment_time"}:
                  raw = classified.get("rawValue") if classified["intent"] == "appointment" else transcript
                  if _looks_datetime(raw):
                      return {"done": False, "message": _set_pending(state, "preferredTime", raw)}
                  return {"done": False, "message": _ask_for("preferredTime")}
              if stage in {"callback_time", "callbackTime"}:
                  if _looks_datetime(transcript):
                      return {"done": False, "message": _set_pending(state, "callbackTime", transcript)}
                  return {"done": False, "message": _ask_for("callbackTime")}
              return {"done": False, "message": "กรุณาตอบคำถามสั้น ๆ อีกครั้งค่ะ"}


          def _handle_broker(state, transcript, classified):
              common = _common_intent(state, classified)
              if common:
                  return common
              stage = state["stage"]
              detected_action = _broker_action(transcript)
              if detected_action == "advice_request" or classified["intent"] == "advice_request":
                  return _complete(state, "advice_request", "คำแนะนำเฉพาะหลักทรัพย์ต้องให้ผู้แนะนำการลงทุนดูแลค่ะ")
              if stage == "choose_action":
                  action = detected_action
                  if action is None and _is_yes(transcript):
                      action = "seminar"
                  if action is None and classified["intent"] in {"seminar", "consultation"}:
                      action = classified["intent"]
                  if action in {"seminar", "consultation"}:
                      state["selectedAction"] = action
                      topic = _broker_topic(transcript)
                      if topic:
                          state["topicInterest"] = topic
                          state["stage"] = "discover_experience"
                          return {"done": False, "message": _broker_topic_prompt(topic)}
                      state["stage"] = "discover_topic"
                      return {
                          "done": False,
                          "message": f"สนใจข้อมูลด้าน{_spoken_options(BROKER_TOPIC_CHOICES)}คะ",
                      }
                  return {"done": False, "message": f"{_spoken_options(BROKER_ACTION_CHOICES)}คะ"}
              if stage == "discover_topic":
                  topic = _broker_topic(transcript)
                  customer_topic = ""
                  if not topic:
                      customer_topic = _customer_words(transcript)
                      if not customer_topic:
                          return {"done": False, "message": f"สนใจข้อมูลด้าน{_spoken_options(BROKER_TOPIC_CHOICES)}คะ"}
                      topic = "customer_stated_topic"
                      state["customerTopic"] = customer_topic
                  state["topicInterest"] = topic
                  state["stage"] = "discover_experience"
                  return {"done": False, "message": _broker_topic_prompt(topic, customer_topic)}
              if stage == "discover_experience":
                  experience = _broker_experience(transcript)
                  customer_experience = ""
                  if not experience:
                      customer_experience = _customer_words(transcript)
                      if not customer_experience:
                          return {"done": False, "message": "คุณเคยลงทุนมาก่อน, หรือกำลังเริ่มศึกษาคะ"}
                      experience = "customer_stated"
                      state["customerExperience"] = customer_experience
                  state["experienceLevel"] = experience
                  state["stage"] = "offer_next_step"
                  topic_label, experience_label = _broker_discovery_summary(state)
                  return {
                      "done": False,
                      "message": (
                          f"รับทราบค่ะ คุณสนใจ{topic_label}และ{experience_label} "
                          f"สะดวก{_spoken_options(BROKER_ACTION_CHOICES)}คะ"
                      ),
                  }
              if stage == "offer_next_step":
                  action = detected_action
                  if action is None and _is_yes(transcript):
                      action = state.get("selectedAction")
                  if _is_no(transcript) or classified["intent"] == "declined":
                      return _complete(state, "declined", "รับทราบค่ะ ขอบคุณที่ให้ข้อมูลและขอบคุณที่สละเวลาค่ะ")
                  if action == "seminar" or classified["intent"] == "seminar":
                      topic, experience = _broker_discovery_summary(state)
                      state["outcomeDetail"] = f"topic={topic}; experience={experience}; tailored seminar details requested"
                      return _complete(
                          state,
                          "seminar_details",
                          f"รับทราบค่ะ ระบบจะส่งรายละเอียดสัมมนาเรื่อง{topic}เพื่อศึกษา โดยไม่ใช่คำแนะนำการลงทุนค่ะ",
                      )
                  if action == "consultation" or classified["intent"] == "consultation":
                      state["selectedAction"] = "consultation"
                      state["stage"] = "preferredTime"
                      return {"done": False, "message": "สะดวกนัดคุยกับผู้แนะนำการลงทุนวันใดและเวลาใดคะ"}
                  return {"done": False, "message": f"สะดวก{_spoken_options(BROKER_ACTION_CHOICES)}คะ"}
              if stage in {"preferred_time", "preferredTime", "consultation_time"}:
                  raw = classified.get("rawValue") if classified["intent"] == "consultation" else transcript
                  if _looks_datetime(raw):
                      return {"done": False, "message": _set_pending(state, "preferredTime", raw)}
                  return {"done": False, "message": _ask_for("preferredTime")}
              if stage in {"callback_time", "callbackTime"}:
                  if _looks_datetime(transcript):
                      return {"done": False, "message": _set_pending(state, "callbackTime", transcript)}
                  return {"done": False, "message": _ask_for("callbackTime")}
              return {"done": False, "message": "กรุณาตอบคำถามสั้น ๆ อีกครั้งค่ะ"}


          def _needs_model(scenario, state, transcript):
              stage = state.get("stage", "")
              if POLICY_V2 and stage in {"hardship_options", "assistance_options"}:
                  return False
              if scenario == "bank":
                  if stage == "verify_identity":
                      return False
                  if stage == "payment_type" and _payment_type(transcript):
                      return False
                  if stage in {"payment_date", "paymentDate"} and _looks_datetime(transcript):
                      return False
                  if stage in {"payment_amount", "paymentAmount"} and _looks_amount(transcript):
                      return False
                  if stage in {"callback_time", "callbackTime"} and _looks_datetime(transcript):
                      return False
              if scenario in {"insurance", "broker"}:
                  if stage in {"preferred_time", "preferredTime", "appointment_time", "consultation_time"} and _looks_datetime(transcript):
                      return False
                  if stage in {"callback_time", "callbackTime"} and _looks_datetime(transcript):
                      return False
              return True


          def _lex_response(event, attributes):
              intent = event.get("sessionState", {}).get("intent", {}) or {}
              intent_name = intent.get("name") or "FallbackIntent"
              return {
                  "sessionState": {
                      "sessionAttributes": attributes,
                      "dialogAction": {"type": "Close"},
                      "intent": {"name": intent_name, "state": "Fulfilled"},
                  },
                  "messages": [{"contentType": "CustomPayload", "content": '{"handled":true}'}],
              }


          def handler(event, context):
              # This function answers to two callers with different event shapes. Lex sends
              # sessionState.sessionAttributes; an Amazon Connect contact flow sends
              # Details.Parameters and expects a flat map of strings back. The profile lookup is
              # invoked by the flow, so reading only the Lex shape left its mode invisible: the
              # request fell through into the dialogue path and the flow logged "The Lambda
              # Function Returned An Error", with the caller hearing no name.
              flow_parameters = (event.get("Details") or {}).get("Parameters") or {}
              if flow_parameters:
                  if str(flow_parameters.get("mode", "")).lower() == PROFILE_LOOKUP_MODE:
                      return _handle_profile_lookup(flow_parameters, event)
                  if str(flow_parameters.get("mode", "")).lower() == VERIFY_MODE:
                      return _handle_verify(flow_parameters, event)
                  # Anything else from a flow is a wiring mistake. Returning a flat map keeps the
                  # flow on its success branch so a caller is never dropped over it.
                  return {"profileFound": "false", "profileGreeting": "", "profileSummary": ""}

              attributes = dict(event.get("sessionState", {}).get("sessionAttributes") or {})
              scenario = str(attributes.get("scenario", "")).lower()
              if scenario not in SCENARIOS:
                  scenario = "insurance"
              transcript = _compact(event.get("inputTranscript"), 240)
              state = _load_state(attributes, scenario)

              # Inbound callers ask questions, so they take the knowledge base path rather than
              # the outbound script. Dispatched here, before any slot filling, because none of
              # the outbound stages apply to someone who dialled in with a question.
              if str(attributes.get("mode", "")).lower() == INBOUND_KB_MODE:
                  state["inboundAttributes"] = {
                      k: attributes.get(k, "") for k in
                      ("profileFound", "profileAmount", "profileDueDate", "profileFirstName",
                       "verified")
                  }
                  result = _handle_inbound_kb(state, transcript)
                  state["lastModel"] = "knowledge-base"
                  state["lastLatencyMs"] = 0
                  return _lex_response(event, {key: str(value) for key, value in {
                      **attributes,
                      "mantleState": json.dumps(state, ensure_ascii=False, separators=(",", ":")),
                      "nextPrompt": _compact(result["message"], 300),
                      "done": "true" if result.get("done") else "false",
                      "modelUsed": "knowledge-base",
                      "modelLatencyMs": "0",
                      "outcomeType": result.get("outcomeType", "pending"),
                      "outcomeDetail": result.get("outcomeDetail", ""),
                      "handoffRequired": result.get("handoffRequired", "false"),
                      "handoffReason": result.get("handoffReason", ""),
                      "handoffSummary": result.get("handoffSummary", ""),
                      "kbAnswers": state.get("kbAnswers", 0),
                  }.items()})
              state["turn"] += 1
              pending_result = _handle_pending(state, transcript)
              classified = {"intent": "unknown", "message": "", "rawValue": "", "model": "deterministic", "latencyMs": 0}
              repeat_requested = bool(
                  POLICY_V2 and state.get("lastMessage") and REPEAT_RE.search(_despace(transcript))
              )
              signal_result = None
              if POLICY_V2 and pending_result is None and not repeat_requested:
                  detected = _detect_signal(transcript)
                  if detected:
                      signal_result = _apply_signal(state, detected, scenario)
              if repeat_requested:
                  result = {"done": False, "message": state["lastMessage"]}
              elif pending_result is not None:
                  result = pending_result
              elif signal_result is not None:
                  result = signal_result
              elif state["turn"] > MAX_TURNS:
                  result = _complete(state, "callback", "เพื่อความสะดวก จะให้เจ้าหน้าที่ติดต่อกลับภายหลังค่ะ")
              elif scenario == "bank" and state["stage"] == "verify_identity":
                  result = _handle_bank(state, transcript, classified, attributes)
              elif not _needs_model(scenario, state, transcript):
                  if scenario == "bank":
                      result = _handle_bank(state, transcript, classified, attributes)
                  elif scenario == "insurance":
                      result = _handle_insurance(state, transcript, classified)
                  else:
                      result = _handle_broker(state, transcript, classified)
              else:
                  classified = _classify(scenario, state, transcript, _facts(attributes, state))
                  if scenario == "bank":
                      result = _handle_bank(state, transcript, classified, attributes)
                  elif scenario == "insurance":
                      result = _handle_insurance(state, transcript, classified)
                  else:
                      result = _handle_broker(state, transcript, classified)
              if repeat_requested:
                  state["noProgress"] = 0
              elif POLICY_V2 and not result.get("done"):
                  message = _compact(result.get("message"), 300)
                  stage = state.get("stage")
                  if message and message == state.get("lastMessage") and stage == state.get("lastStage"):
                      state["noProgress"] = int(state.get("noProgress", 0)) + 1
                  else:
                      state["noProgress"] = 0
                      state["lastMessage"] = message
                      state["lastStage"] = stage
                  if state["noProgress"] >= MAX_REPEATS:
                      state["outcomeDetail"] = "unresolved after repeated prompts"
                      result = _complete(state, "unresolved_needs_human",
                                         "ขออภัยค่ะ " + HANDOFF_HOLD_TH)
              state["lastModel"] = classified.get("model", "deterministic")
              state["lastLatencyMs"] = classified.get("latencyMs", 0)
              output = {
                  **attributes,
                  "mantleState": json.dumps(state, ensure_ascii=False, separators=(",", ":")),
                  "nextPrompt": _compact(result["message"], 300),
                  "done": "true" if result.get("done") else "false",
                  "modelUsed": str(state["lastModel"]),
                  "modelLatencyMs": str(state["lastLatencyMs"]),
                  "outcomeType": result.get("outcomeType", "pending"),
                  "outcomeDetail": result.get("outcomeDetail", ""),
                  "paymentType": result.get("paymentType", "unspecified"),
                  "paymentDate": result.get("paymentDate", "unspecified"),
                  "paymentAmount": result.get("paymentAmount", "unspecified"),
                  "productInterest": result.get("productInterest", "unspecified"),
                  "preferredTime": result.get("preferredTime", "unspecified"),
                  "topicInterest": result.get("topicInterest", "general_market_update"),
                  "customerGoal": result.get("customerGoal", state.get("customerGoal", "unspecified")),
                  "experienceLevel": result.get("experienceLevel", state.get("experienceLevel", "unspecified")),
                  "primarySignal": state.get("primarySignal", "none"),
                  "policyVersion": "v2" if POLICY_V2 else "v1",
                  # The flow compares on handoffRequired to decide whether to fetch an agent.
                  # These must be listed explicitly: this dict is the whole contract with the
                  # flow, so a key produced by _complete but omitted here simply never arrives
                  # and the transfer silently never happens.
                  "handoffRequired": result.get("handoffRequired", "false"),
                  "handoffReason": result.get("handoffReason", ""),
                  "handoffSummary": result.get("handoffSummary", ""),
              }
              return _lex_response(event, {key: str(value) for key, value in output.items()})
  MantleLexRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fsi-mantle-lex-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lexv2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ThaiSpeech
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'

  MantleLexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: fsi-mantle-dialogue-bot
      RoleArn: !GetAtt MantleLexRole.Arn
      DataPrivacy: { ChildDirected: false }
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: th_TH
          NluConfidenceThreshold: 0.4
          GenerativeAISettings:
            RuntimeSettings:
              NluImprovementSpecification:
                Enabled: true
                AssistedNluMode: Primary
          Intents:
            - Name: MantleDialogue
              Description: Catch-all utterance that invokes the isolated Mantle dialogue Lambda
              SampleUtterances:
                - Utterance: เริ่มสนทนา
                - Utterance: ต้องการข้อมูล
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true

  MantleLexVersionV2:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref MantleLexBot
      Description: Mantle dialogue v2 with Primary assisted NLU
      BotVersionLocaleSpecification:
        - LocaleId: th_TH
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }

  MantleLexAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotAliasName: live
      BotId: !Ref MantleLexBot
      BotVersion: !GetAtt MantleLexVersionV2.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: th_TH
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: '1.0'
                LambdaArn: !GetAtt MantleDialogueFunction.Arn

  MantleLexPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MantleDialogueFunction
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !GetAtt MantleLexAlias.Arn

  MantleConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MantleDialogueFunction
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceArn: !Ref ConnectInstanceArn

  MantleDialogueAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt MantleDialogueFunction.Arn

  MantleLexIntegration:
